name: Bug report
description: Report a reproducible Codex Trajectory problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach real Codex logs or unredacted task screenshots.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include sanitized reproduction steps and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: Paste only sanitized error output.
