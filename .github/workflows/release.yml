name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only by the final `gh release create` step.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.7.22"
          # Release artifacts must not consume caches populated by lower-trust runs.
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run playwright install --with-deps chromium
      - name: Validate tag and package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run python scripts/validate_release.py --version "$version"
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest --cov --cov-report=term-missing
          RUN_UI_TESTS=1 uv run pytest plugins/codex-trajectory/tests/test_ui.py -q
          uv run python scripts/smoke_mcp.py
          mkdir -p dist
          git archive --format=zip --prefix="codex-trajectory-$version/" --output="dist/codex-trajectory-v$version.zip" HEAD
          git archive --format=tar --prefix="codex-trajectory-$version/" HEAD | gzip -n > "dist/codex-trajectory-v$version.tar.gz"
          uv run python scripts/check_archives.py "dist/codex-trajectory-v$version.zip" "dist/codex-trajectory-v$version.tar.gz"
          cd dist
          sha256sum codex-trajectory-v* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/codex-trajectory-v*.zip
          dist/codex-trajectory-v*.tar.gz
          dist/SHA256SUMS
          --title "Codex Trajectory $GITHUB_REF_NAME"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
