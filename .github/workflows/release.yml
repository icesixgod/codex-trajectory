name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.5"
          # Release artifacts must not consume caches populated by lower-trust runs.
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run playwright install --with-deps chromium
      - name: Validate tag and package
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be an exact vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          test "$tagged_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main
          version="${GITHUB_REF_NAME#v}"
          uv run python scripts/validate_release.py --version "$version"
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run mypy --no-incremental --platform win32
          uv run pytest --cov --cov-report=term-missing
          uv run coverage report --include='plugins/codex-trajectory/scripts/codex_trajectory/*.py' --fail-under=85
          uv run coverage report --include='plugins/codex-trajectory/scripts/codex_trajectory_cdp.py' --fail-under=50
          uv run coverage report --include='plugins/codex-trajectory/scripts/codex_trajectory_mcp.py' --fail-under=85
          RUN_UI_TESTS=1 uv run pytest plugins/codex-trajectory/tests/test_ui.py plugins/codex-trajectory/tests/test_cdp_transport.py -q
          uv run python scripts/smoke_mcp.py
          mkdir -p dist
          git archive --format=zip --prefix="codex-trajectory-$version/" --output="dist/codex-trajectory-v$version.zip" HEAD
          git archive --format=tar --prefix="codex-trajectory-$version/" HEAD | gzip -n > "dist/codex-trajectory-v$version.tar.gz"
          uv run python scripts/check_archives.py "dist/codex-trajectory-v$version.zip" "dist/codex-trajectory-v$version.tar.gz"
          zip_root="$(mktemp -d)"
          tar_root="$(mktemp -d)"
          unzip -q "dist/codex-trajectory-v$version.zip" -d "$zip_root"
          tar -xzf "dist/codex-trajectory-v$version.tar.gz" -C "$tar_root"
          uv run --no-project python "$zip_root/codex-trajectory-$version/scripts/smoke_mcp.py"
          uv run --no-project python "$tar_root/codex-trajectory-$version/scripts/smoke_mcp.py"
          cd dist
          sha256sum codex-trajectory-v* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: |
            dist/codex-trajectory-v*.zip
            dist/codex-trajectory-v*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Verify immutable release tag
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/codex-trajectory-v*.zip
          dist/codex-trajectory-v*.tar.gz
          dist/SHA256SUMS
          --title "Codex Trajectory $GITHUB_REF_NAME"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
          --verify-tag
