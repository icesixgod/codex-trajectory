        const success = canvasColor("--success", "#5ed39e");
        const danger = canvasColor("--danger", "#ff7285");
        context.clearRect(0, 0, PIP_CANVAS_WIDTH, PIP_CANVAS_HEIGHT);
        context.fillStyle = background;
        context.fillRect(0, 0, PIP_CANVAS_WIDTH, PIP_CANVAS_HEIGHT);

        if (!snapshot?.session) {
          context.fillStyle = muted;
          context.font = "600 24px -apple-system, BlinkMacSystemFont, sans-serif";
          context.fillText(labels.pipPreparing, 40, 80);
          return;
        }

        const latest = snapshot.records?.at(-1) || {};
        const stats = snapshot.stats || {};
        const usage = usageView(hasTokenUsage(stats.tokens) ? stats.tokens : {});
        const status = latest.status || "—";
        const { cursor } = liveCursorState(latest, stats);
        const stateLabel = liveStateLabel();
        const tokenItems = [
          [labels.totalTokens, usage.total],
          [labels.uncachedInput, usage.uncached],
          [labels.cachedInput, usage.cached],
          [labels.outputTokens, usage.output],
          [labels.reasoningTokens, usage.reasoning],
        ];

        context.textBaseline = "alphabetic";
        context.fillStyle = accent;
        context.font = "750 19px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(labels.liveTitle.toUpperCase(), 40, 55);
        context.fillStyle = text;
        context.font = "750 34px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(fitCanvasText(context, snapshot.session.title || snapshot.session.id, 560), 40, 105);

        context.beginPath();
        context.arc(50, 150, 8, 0, Math.PI * 2);
        context.fillStyle = liveError ? danger : success;
        context.fill();
        context.fillStyle = muted;
        context.font = "600 20px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(stateLabel, 72, 157);

        fillCanvasPanel(context, 40, 185, 560, 120, panelAlt);
        context.fillStyle = text;
        context.font = "750 43px ui-monospace, SFMono-Regular, Menlo, monospace";
        context.fillText(fitCanvasText(context, cursor, 510), 64, 247);
        context.fillStyle = muted;
        context.font = "600 18px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(fitCanvasText(context, status + " · " + number(stats.records) + " " + labels.records, 510), 64, 282);

        fillCanvasPanel(context, 40, 330, 560, 180, panel);
        context.fillStyle = accent;
        context.font = "750 16px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(labels.latestEvent.toUpperCase(), 64, 370);
        context.fillStyle = text;
        context.font = "750 25px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(fitCanvasText(context, latest.event || "—", 510), 64, 410);
        context.fillStyle = muted;
        context.font = "500 20px -apple-system, BlinkMacSystemFont, sans-serif";
        wrapCanvasText(context, latest.summary || labels.noMatch, 510, 3).forEach((line, index) => {
          context.fillText(line, 64, 450 + index * 27);
        });

        function drawTokenCard(item, x, y, width, height, emphasized = false) {
          fillCanvasPanel(context, x, y, width, height, emphasized ? panelAlt : panel);
          context.fillStyle = muted;
          context.font = "700 15px -apple-system, BlinkMacSystemFont, sans-serif";
          context.fillText(fitCanvasText(context, item[0].toUpperCase(), width - 40), x + 20, y + 31);
          context.fillStyle = emphasized ? accent : text;
          context.font = "750 28px ui-monospace, SFMono-Regular, Menlo, monospace";
          context.fillText(fitCanvasText(context, number(item[1]), width - 40), x + 20, y + 72);
        }

        drawTokenCard(tokenItems[0], 40, 540, 560, 98, true);
        drawTokenCard(tokenItems[1], 40, 660, 270, 98);
        drawTokenCard(tokenItems[2], 330, 660, 270, 98);
        drawTokenCard(tokenItems[3], 40, 780, 270, 98);
        drawTokenCard(tokenItems[4], 330, 780, 270, 98);

        context.fillStyle = muted;
        context.font = "600 16px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(labels.liveSafe, 40, 925);
        const checked = labels.checked + ": " + (liveCheckedAt ? date(liveCheckedAt) : "—");
        context.textAlign = "right";
        context.fillText(fitCanvasText(context, checked, 360), 600, 925);
        context.textAlign = "left";

        pipCanvas.dataset.cursor = cursor;
        pipCanvas.dataset.tokens = tokenItems.map(item => String(item[1])).join(",");
        pipCanvas.dataset.latest = latest.summary || "";
        pipCanvas.dataset.detailLevel = "summary";
        pipCanvas.dataset.liveState = stateLabel;
        pipCanvas.dataset.payload = JSON.stringify({
          detailLevel: "summary",
          sessionId: snapshot.session.id,
          cursor,
          latest: {
            event: latest.event || "",
            summary: latest.summary || "",
            status,
          },
          tokens: tokenItems.map(item => item[1]),
        });
      }

      function liveViewState() {
        const snapshot = liveData || (data ? safeLiveSnapshot(data) : null);
        if (!snapshot?.session) return null;
        const latest = snapshot.records?.at(-1) || {};
        const stats = snapshot.stats || {};
        const usage = usageView(hasTokenUsage(stats.tokens) ? stats.tokens : {});
        const cursorState = liveCursorState(latest, stats);
        return {
          snapshot,
          latest,
          stats,
          cursor: cursorState.cursor,
          cursorParts: cursorState,
          stateLabel: liveStateLabel(),
          tokenItems: [
            [labels.totalTokens, usage.total],
            [labels.uncachedInput, usage.uncached],
            [labels.cachedInput, usage.cached],
            [labels.outputTokens, usage.output],
            [labels.reasoningTokens, usage.reasoning],
          ],
        };
      }

      function dockRecordUsage(record) {
        if (!hasTokenUsage(record.usage)) {
          return {
            tokenValues: "",
            markup: `<span class="dock-no-usage">${escapeHtml(labels.noRecordTokens)}</span>`,
          };
        }
        const usage = usageView(record.usage);
        const tokenValues = [usage.total, usage.uncached, usage.cached, usage.output, usage.reasoning]
          .map(String).join(",");
        const part = (label, value) => `<span class="dock-usage-part"><span class="dock-usage-part-label">${escapeHtml(label)}</span><strong class="dock-usage-part-value">${escapeHtml(number(value))}</strong></span>`;
        return {
          tokenValues,
          markup: `
            <div class="dock-usage-row total" data-token-group="total">
              <span class="dock-usage-name">${escapeHtml(labels.totalTokens)}</span>
              <strong class="dock-usage-value">${escapeHtml(number(usage.total))}</strong>
            </div>
            <div class="dock-usage-row input" data-token-group="input">
              <span class="dock-usage-name">${escapeHtml(labels.inputTokens)}</span>
              <strong class="dock-usage-value">${escapeHtml(number(usage.input))}</strong>
              <span class="dock-usage-parts">${part(labels.uncachedInput, usage.uncached)}${part(labels.cachedInput, usage.cached)}</span>
            </div>
            <div class="dock-usage-row output" data-token-group="output">
              <span class="dock-usage-name">${escapeHtml(labels.outputTokens)}</span>
              <strong class="dock-usage-value">${escapeHtml(number(usage.output))}</strong>
              <span class="dock-usage-parts">${part(labels.visibleOutput, usage.visible)}${part(labels.reasoningTokens, usage.reasoning)}</span>
            </div>`,
        };
      }

      function dockRecordMarkup(record, latest) {
        const safeKinds = new Set(["user", "assistant", "reasoning", "tool", "subagent", "compaction"]);
        const kind = safeKinds.has(record.kind) ? record.kind : "other";
        const recordCursor = "T" + number(record.turn) + " / "
          + (Number.isFinite(record.step) ? "S" + record.step : "S—") + " / "
          + (Number.isFinite(record.index) ? "#" + record.index : "#—");
        const state = (record.status || "—") + " · " + duration(record.durationMs);
        const usage = dockRecordUsage(record);
        const recordId = String(record.id || record.index || "");
        const mining = latest && recordId === liveMiningRecordId;
        const whaleMiner = latest ? `<span class="dock-whale-miner${mining ? " mining" : ""}"
          data-record-id="${escapeHtml(recordId)}" data-mining="${String(mining)}" aria-hidden="true">
          <span class="dock-whale-miner-viewport"><span class="dock-whale-miner-y"><span class="dock-whale-miner-sheet"></span></span></span>
        </span>` : "";
        return `<article class="dock-record${latest ? " latest" : ""}" role="listitem"
          data-index="${escapeHtml(record.index)}" data-kind="${kind}" data-record-tokens="${escapeHtml(usage.tokenValues)}">
          ${whaleMiner}
          <div class="dock-record-head"><span class="dock-record-cursor">${escapeHtml(recordCursor)}</span><span class="dock-record-state">${escapeHtml(state)}</span></div>
          <div class="dock-record-event" title="${escapeHtml(record.event || "—")}">${escapeHtml(record.event || "—")}</div>
          <div class="dock-record-summary">${escapeHtml(record.summary || labels.noMatch)}</div>
          <div class="dock-record-usage" aria-label="${escapeHtml(labels.recordTokens)}">${usage.markup}</div>
        </article>`;
      }

      function dockRecordRows(records) {
        return records.map((record, index) => dockRecordMarkup(record, index === records.length - 1)).join("");
      }

      function setDockText(selector, value) {
        const element = document.querySelector(selector);
        if (!element) return;
        const next = String(value ?? "");
        if (element.textContent !== next) element.textContent = next;
      }

      function setDockAttribute(element, name, value) {
        if (!element) return;
        const next = String(value ?? "");
        if (element.getAttribute(name) !== next) element.setAttribute(name, next);
      }

      function bindDockStream(stream) {
        if (!stream || stream.dataset.scrollBound === "true") return;
        stream.dataset.scrollBound = "true";
        stream.addEventListener("scroll", () => {
          dockScrollTop = stream.scrollTop;
          dockFollowLatest = stream.scrollHeight - stream.scrollTop - stream.clientHeight <= 36;
          stream.dataset.followLatest = String(dockFollowLatest);
        }, { passive: true });
      }

      function bindDockWhaleMiner(stream) {
        const miner = stream?.querySelector(".dock-whale-miner.mining");
        if (!miner) return;
        const finish = () => {
          if (liveMiningRecordId === miner.dataset.recordId) liveMiningRecordId = null;
          miner.classList.remove("mining");
          miner.dataset.mining = "false";
        };
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          finish();
          return;
        }
        miner.querySelector(".dock-whale-miner-y")?.addEventListener("animationend", finish, { once: true });
      }

      function mountDockedShell(view) {
        const { snapshot, latest, stats, cursor, cursorParts, stateLabel, tokenItems } = view;
        const tokenValues = tokenItems.map(item => String(item[1])).join(",");
        const tokenCards = tokenItems.slice(1).map((item, index) => `
          <div class="dock-token" data-dock-token="${index + 1}">
            <div class="dock-token-label">${escapeHtml(item[0])}</div>
            <div class="dock-token-value">${escapeHtml(number(item[1]))}</div>
          </div>`).join("");
        const records = snapshot.records || [];
        const revision = liveRevision || "";
        document.body.classList.add("dock-mode");
        app.innerHTML = `
          <section class="dock-shell" id="liveDock" role="complementary" aria-label="${escapeHtml(labels.liveTitle)}"
            data-session-id="${escapeHtml(snapshot.session.id)}"
            data-presentation="docked" data-detail-level="summary" data-cursor="${escapeHtml(cursor)}"
            data-tokens="${escapeHtml(tokenValues)}" data-latest="${escapeHtml(latest.summary || "")}" data-record-count="${records.length}">
            <div class="dock-fixed" id="dockFixedSummary">
              <header class="dock-head">
                <div><div class="dock-kicker">${escapeHtml(labels.liveTitle)}</div><div class="dock-title" id="dockSessionTitle" title="${escapeHtml(snapshot.session.title || snapshot.session.id)}">${escapeHtml(snapshot.session.title || snapshot.session.id)}</div></div>
                <button class="dock-close" id="closeDock" type="button" aria-label="${escapeHtml(labels.returnInline)}" title="${escapeHtml(labels.returnInline)}">×</button>
              </header>
              <div class="dock-status">
                <span class="dock-live-state" aria-live="polite"><span class="dock-live-dot${liveError ? " error" : ""}" id="dockLiveDot"></span><span id="dockLiveState">${escapeHtml(stateLabel)}</span></span>
                <span class="dock-cursor" id="dockCursor" aria-label="${escapeHtml(cursor)}"><span class="dock-cursor-part" id="dockCursorTurn">${escapeHtml(cursorParts.turn)}</span><span class="dock-cursor-separator">/</span><span class="dock-cursor-part" id="dockCursorStep">${escapeHtml(cursorParts.step)}</span><span class="dock-cursor-separator">/</span><span class="dock-cursor-part" id="dockCursorRecord">${escapeHtml(cursorParts.record)}</span></span>
                <span class="dock-mode-label">${escapeHtml(labels.dockMode)}</span>
              </div>
              <section class="dock-overview" aria-label="${escapeHtml(labels.taskTotal)}">
                <div class="dock-overview-head"><span class="dock-section-label">${escapeHtml(labels.taskTotal)}</span><span class="dock-overview-meta" id="dockOverviewMeta">${escapeHtml(number(stats.turns) + " " + labels.turns + " · " + number(stats.records) + " " + labels.records)}</span></div>
                <div class="dock-total"><div><div class="dock-total-label">${escapeHtml(tokenItems[0][0])}</div><div class="dock-total-value" id="dockTotalValue">${escapeHtml(number(tokenItems[0][1]))}</div></div><div class="dock-total-label">${escapeHtml(labels.liveSafe)}</div></div>
                <div class="dock-token-grid">${tokenCards}</div>
              </section>
            </div>
            <section class="dock-stream" aria-label="${escapeHtml(labels.liveOutput)}">
              <header class="dock-stream-head"><span class="dock-stream-title">${escapeHtml(labels.liveOutput)}</span><span class="dock-stream-meta" id="dockStreamMeta">${escapeHtml(number(records.length) + " " + labels.recentRecords + " · " + labels.latestBelow)}</span></header>
              <div class="dock-records" id="liveRecordStream" role="list" data-follow-latest="${String(dockFollowLatest)}" data-revision="${escapeHtml(revision)}">${dockRecordRows(records)}</div>
            </section>
            <footer class="dock-foot"><span>${escapeHtml(labels.liveSafe)}</span><span id="dockChecked">${escapeHtml(labels.checked + ": " + (liveCheckedAt ? date(liveCheckedAt) : "—"))}</span></footer>
          </section>`;
        document.getElementById("closeDock")?.addEventListener("click", exitPip);
        const stream = document.getElementById("liveRecordStream");
        bindDockStream(stream);
        bindDockWhaleMiner(stream);
        if (stream && dockFollowLatest) stream.scrollTop = stream.scrollHeight;
      }

      function patchDockedShell(view) {
        const { snapshot, latest, stats, cursor, cursorParts, stateLabel, tokenItems } = view;
        const dock = document.getElementById("liveDock");
        if (!dock || dock.dataset.sessionId !== String(snapshot.session.id)) {
          mountDockedShell(view);
          return;
        }
        document.body.classList.add("dock-mode");
        const records = snapshot.records || [];
        const tokenValues = tokenItems.map(item => String(item[1])).join(",");
        setDockAttribute(dock, "data-cursor", cursor);
        setDockAttribute(dock, "data-tokens", tokenValues);
        setDockAttribute(dock, "data-latest", latest.summary || "");
        setDockAttribute(dock, "data-record-count", records.length);

        const title = snapshot.session.title || snapshot.session.id;
        setDockText("#dockSessionTitle", title);
        setDockAttribute(document.getElementById("dockSessionTitle"), "title", title);
        setDockText("#dockLiveState", stateLabel);
        document.getElementById("dockLiveDot")?.classList.toggle("error", Boolean(liveError));
        setDockText("#dockCursorTurn", cursorParts.turn);
        setDockText("#dockCursorStep", cursorParts.step);
        setDockText("#dockCursorRecord", cursorParts.record);
        setDockAttribute(document.getElementById("dockCursor"), "aria-label", cursor);
        setDockText("#dockOverviewMeta", number(stats.turns) + " " + labels.turns + " · " + number(stats.records) + " " + labels.records);
        setDockText("#dockTotalValue", number(tokenItems[0][1]));
        tokenItems.slice(1).forEach((item, index) => {
          setDockText(`[data-dock-token="${index + 1}"] .dock-token-value`, number(item[1]));
        });
        setDockText("#dockStreamMeta", number(records.length) + " " + labels.recentRecords + " · " + labels.latestBelow);
        setDockText("#dockChecked", labels.checked + ": " + (liveCheckedAt ? date(liveCheckedAt) : "—"));

        const stream = document.getElementById("liveRecordStream");
        if (!stream) return;
        bindDockStream(stream);
        const revision = liveRevision || "";
        if (stream.dataset.revision === revision) return;
        dockScrollTop = stream.scrollTop;
        dockFollowLatest = stream.scrollHeight - stream.scrollTop - stream.clientHeight <= 36;
        stream.innerHTML = dockRecordRows(records);
        stream.dataset.revision = revision;
        stream.dataset.followLatest = String(dockFollowLatest);
        bindDockWhaleMiner(stream);
        if (dockFollowLatest) stream.scrollTop = stream.scrollHeight;
        else stream.scrollTop = Math.min(dockScrollTop, Math.max(0, stream.scrollHeight - stream.clientHeight));
      }

      function drawDockedShell() {
        const view = liveViewState();
        if (!view) return;
        if (document.getElementById("liveDock")) patchDockedShell(view);
        else mountDockedShell(view);
      }

      function drawLiveSurface() {
        if (isDockMode()) drawDockedShell();
        else drawPipCanvas();
      }

      function updatePipButton() {
        const button = document.getElementById("openPip");
        if (!button) return;
        const active = isLiveMode();
        const ready = hostDockSupported() || (nativePipSupported() && pipReady);
        button.textContent = active ? labels.exitPip : labels.livePip;
        button.setAttribute("aria-pressed", String(active));
        button.disabled = presentationBusy || (!active && !ready);
        button.title = active
          ? labels.exitPip
          : hostDockSupported() || pipReady
            ? labels.livePip
            : pipPreparationError || (nativePipSupported() ? labels.pipPreparing : labels.pipUnavailable);
      }

      function prepareNativePipMedia(force = false) {
        if ((!force && hostDockSupported()) || pipVideo || !nativePipSupported()) {
          updatePipButton();
          return pipVideo;
        }
        try {
          const holder = document.createElement("div");
          holder.id = "nativePipMedia";
          holder.setAttribute("aria-hidden", "true");
          const canvas = document.createElement("canvas");
          canvas.id = "pipCanvas";
          canvas.width = PIP_CANVAS_WIDTH;
          canvas.height = PIP_CANVAS_HEIGHT;
          const video = document.createElement("video");
          video.id = "pipVideo";
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.disablePictureInPicture = false;
          holder.append(canvas, video);
          document.body.append(holder);
          pipCanvas = canvas;
          pipVideo = video;
          drawPipCanvas();

          const markReady = () => {
            if (!pipVideo || pipVideo.readyState < HTMLMediaElement.HAVE_METADATA) return;
            pipReady = true;
            pipPreparationError = null;
            updatePipButton();
          };
          video.addEventListener("loadedmetadata", markReady);
          video.addEventListener("canplay", markReady);
          video.addEventListener("enterpictureinpicture", () => activateNativePip());
          video.addEventListener("leavepictureinpicture", () => finishNativePip(true));
          pipStream = canvas.captureStream(1);
          video.srcObject = pipStream;
          const playback = video.play();
          if (playback?.catch) playback.catch(error => {
            pipPreparationError = String(error?.message || error);
            updatePipButton();
          });
          markReady();
          return video;
        } catch (error) {
          pipPreparationError = String(error?.message || error);
          pipReady = false;
          updatePipButton();
          return null;
        }
      }

      function stopLiveLoop() {
        if (liveTimer !== null) window.clearTimeout(liveTimer);
        liveTimer = null;
      }

      function activateNativePip() {
        if (!liveData && data) liveData = safeLiveSnapshot(data);
        if (!liveSessionId && data) liveSessionId = data.session.id;
        livePresentation = "native-pip";
        pipActive = true;
        document.body.classList.remove("dock-mode");
        if (pipVideo) pipVideo.dataset.active = "true";
        drawPipCanvas();
        updatePipButton();
        startLiveLoop();
      }

      function activateDockedWindow() {
        if (!liveData && data) liveData = safeLiveSnapshot(data);
        if (!liveSessionId && data) liveSessionId = data.session.id;
        livePresentation = "docked";
        dockFollowLatest = true;
        dockScrollTop = 0;
        pipActive = false;
        if (pipVideo) pipVideo.dataset.active = "false";
        drawDockedShell();
        startLiveLoop();
      }

      function finishLiveWindow(reload) {
        const wasActive = isLiveMode() || liveSessionId !== null;
        const sessionId = liveSessionId;
        const detailLevel = restoreDetailLevel;
        livePresentation = "none";
        pipActive = false;
        pipWindow = null;
        if (pipVideo) pipVideo.dataset.active = "false";
        stopLiveLoop();
        liveData = null;
        liveSessionId = null;
        liveRevision = null;
        liveCheckedAt = null;
        liveError = null;
        liveFailures = 0;
        liveMiningRecordId = null;
        dockFollowLatest = true;
        dockScrollTop = 0;
        document.body.classList.remove("dock-mode");
        drawPipCanvas();
        if (data) drawShell();
        if (reload && wasActive && !busy && data?.session?.id === sessionId) {
          void loadSession(sessionId, detailLevel);
        }
      }

      function finishNativePip(reload) {
        if (isDockMode()) return;
        finishLiveWindow(reload);
      }

      async function enterPip() {
        if (!data || presentationBusy) return;
        if (isLiveMode()) {
          await exitPip();
          return;
        }
        restoreDetailLevel = data.detailLevel === "full" ? "full" : "summary";
        liveData = safeLiveSnapshot(data);
        liveSessionId = data.session.id;
        liveRevision = null;
        liveCheckedAt = null;
        liveFailures = 0;
        liveError = null;
        liveMiningRecordId = null;
        presentationBusy = true;
        updatePipButton();
        let hostError = null;
        try {
          if (hostDockSupported()) {
            try {
              await requestHostDisplayMode("fullscreen");
              activateDockedWindow();
              return;
            } catch (error) {
              hostError = error;
            }
          }
          const video = prepareNativePipMedia(true);
          drawPipCanvas();
          if (!video || !pipReady) throw new Error(pipPreparationError || labels.pipUnavailable);
          pipWindow = await withTimeout(video.requestPictureInPicture());
          activateNativePip();
          pipWindow?.addEventListener?.("resize", drawPipCanvas);
        } catch (error) {
          const reason = hostError
            ? String(hostError?.message || hostError) + "; " + String(error?.message || error)
            : String(error?.message || error);
          finishLiveWindow(false);
          showLoadError(new Error(labels.pipFailed + ": " + reason));
        } finally {
          presentationBusy = false;
          updatePipButton();
        }
      }

      async function exitPip() {
        if (!isLiveMode() || presentationBusy) return;
        const presentation = livePresentation;
        presentationBusy = true;
        updatePipButton();
        try {
          if (presentation === "docked") {
            await requestHostDisplayMode("inline");
            if (isDockMode()) finishLiveWindow(true);
          } else if (
            typeof document.exitPictureInPicture === "function"
            && document.pictureInPictureElement
          ) {
            await withTimeout(document.exitPictureInPicture());
          }
          if (isNativePipMode()) finishNativePip(true);
        } catch (error) {
          liveError = String(error?.message || error);
          drawLiveSurface();
          updatePipButton();
        } finally {
          presentationBusy = false;
          updatePipButton();
        }
      }

      function computeDomain() {
        const ranges = (data?.records || []).map(recordRange).filter(Boolean);
        if (!ranges.length) return { start: Date.now(), end: Date.now() + 1 };
        const start = Math.min(...ranges.map(range => range.start));
        let end = Math.max(...ranges.map(range => range.end));
        if (end <= start) end = start + 1;
        return { start, end };
      }

      function pageState(snapshot = data) {
        const records = snapshot?.records || [];
        const firstRecord = records.at(0)?.index ?? null;
        const lastRecord = records.at(-1)?.index ?? null;
        const totalRecords = Number.isFinite(snapshot?.stats?.records) ? snapshot.stats.records : records.length;
        const earlierRecords = firstRecord === null ? 0 : Math.max(0, firstRecord - 1);
        const laterRecords = lastRecord === null ? totalRecords : Math.max(0, totalRecords - lastRecord);
        return {
          firstRecord,
          lastRecord,
          earlierRecords,
          laterRecords,
          hasEarlier: earlierRecords > 0,
          hasLater: laterRecords > 0,
          nextBeforeRecord: earlierRecords > 0 ? firstRecord : null,
        };
      }

      function mergeEarlierPage(current, page) {
        if (page?.session?.id !== current.session.id || page.detailLevel !== current.detailLevel) {
          throw new Error(labels.loadError);
        }
        const recordsByIndex = new Map();
        for (const record of [...(page.records || []), ...current.records]) recordsByIndex.set(record.index, record);
        const records = [...recordsByIndex.values()].sort((left, right) => left.index - right.index);
        const turnsByIndex = new Map();
        for (const turn of [...(page.turns || []), ...(current.turns || [])]) turnsByIndex.set(turn.index, turn);
        const turns = [...turnsByIndex.values()].sort((left, right) => left.index - right.index);
        const warningKeys = new Set();
        const warnings = [...(current.warnings || []), ...(page.warnings || [])].filter(warning => {
          const key = `${warning.code}\u0000${warning.line}\u0000${warning.message}`;
          if (warningKeys.has(key)) return false;
          warningKeys.add(key);
          return true;
        });
        const totalRecords = Number.isFinite(current.stats?.records) ? current.stats.records : records.length;
        const totalTurns = Number.isFinite(current.stats?.turns) ? current.stats.turns : turns.length;
        const stats = {
          ...current.stats,
          visibleRecords: records.length,
          omittedRecords: Math.max(0, totalRecords - records.length),
        };
        if (turns.length < totalTurns) {
          stats.visibleTurns = turns.length;
          stats.omittedTurns = totalTurns - turns.length;
        } else {
          delete stats.visibleTurns;
          delete stats.omittedTurns;
        }
        const merged = { ...current, stats, turns, records, warnings };
        merged.pagination = pageState(merged);
        return merged;
      }

      function render(next, options = {}) {
        if (!next?.session || !Array.isArray(next.records)) return;
        const previousSessionId = data?.session?.id;
        const previousLastTurn = data?.records?.at(-1)?.turn;
        const nextLastTurn = next.records.at(-1)?.turn;
        const resetToLatest = previousSessionId !== next.session.id || previousLastTurn !== nextLastTurn || expandedTurns.size === 0;
        const previousSelectedIndex = selectedIndex;
        const previousLedger = document.querySelector(".ledger-wrap");
        const previousScrollTop = previousLedger?.scrollTop || 0;
        const previousScrollHeight = previousLedger?.scrollHeight || 0;
        if (resetToLatest) expandedTurns = new Set(Number.isFinite(nextLastTurn) ? [nextLastTurn] : []);
        data = next;
        if (isLiveMode() && next.session.id === liveSessionId) liveData = safeLiveSnapshot(next);
        prepareNativePipMedia();
        fullConfirmationOpen = false;
        fullDomain = computeDomain();
        viewport = { ...fullDomain };
        selectedRange = null;
        selectedIndex = !resetToLatest && next.records.some(record => record.index === previousSelectedIndex) ? previousSelectedIndex : next.records.at(-1)?.index || null;
        if (isDockMode()) drawDockedShell(); else drawShell();
        if (isNativePipMode()) drawPipCanvas();
        const ledgerWrap = document.querySelector(".ledger-wrap");
        if (ledgerWrap) {
          if (options.prepend) ledgerWrap.scrollTop = previousScrollTop + Math.max(0, ledgerWrap.scrollHeight - previousScrollHeight);
          else ledgerWrap.scrollTop = resetToLatest ? ledgerWrap.scrollHeight : previousScrollTop;
        }
        if (isLiveMode() && !liveBusy && liveTimer === null) startLiveLoop();
      }

      function stat(label, value) {
        const formatted = String(value);
        return `<div class="stat"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value ${numberFitClass(formatted)}">${escapeHtml(formatted)}</div></div>`;
      }

      function numberFitClass(formatted) {
        if (formatted.length > 18) return "number-xlong";
        if (formatted.length > 14) return "number-long";
        return "";
      }

      const firstNumber = (...values) => values.find(value => Number.isFinite(value)) ?? 0;

      function usageView(raw = {}) {
        const input = firstNumber(raw.input_tokens, raw.prompt_tokens);
        const cached = firstNumber(raw.cached_input_tokens, raw.input_tokens_details?.cached_tokens, raw.prompt_tokens_details?.cached_tokens);
        const output = firstNumber(raw.output_tokens, raw.completion_tokens);
        const reasoning = firstNumber(raw.reasoning_output_tokens, raw.output_tokens_details?.reasoning_tokens, raw.completion_tokens_details?.reasoning_tokens);
        return {
          total: firstNumber(raw.total_tokens, input + output),
          input,
          cached,
          uncached: Math.max(0, input - cached),
          output,
          reasoning,
          visible: Math.max(0, output - reasoning),
        };
      }

      function hasTokenUsage(raw) {
        return raw && typeof raw === "object" && Object.values(raw).some(value => Number.isFinite(value));
      }

      function aggregateUsage(items) {
        const result = {};
        for (const raw of items) {
          if (!raw || typeof raw !== "object") continue;
          for (const [key, value] of Object.entries(raw)) {
            if (Number.isFinite(value)) result[key] = (result[key] || 0) + value;
          }
        }
        return result;
      }

      function percentage(value, total) {
        if (!Number.isFinite(value) || !Number.isFinite(total) || total <= 0) return "—";
        return `${new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(value / total * 100)}%`;
      }

      function tokenMetric(key, label, value) {
        const formatted = number(value);
        return `<div class="token-metric" data-token-metric="${escapeHtml(key)}"><div class="token-metric-label">${escapeHtml(label)}</div><div class="token-metric-value ${numberFitClass(formatted)}">${escapeHtml(formatted)}</div></div>`;
      }

      function tokenSegment(className, label, value, total) {
        if (!Number.isFinite(value) || value <= 0 || !Number.isFinite(total) || total <= 0) return "";
        const width = Math.max(0, Math.min(100, value / total * 100));
        return `<span class="token-segment ${className}" style="width:${width}%" title="${escapeHtml(label)} · ${escapeHtml(number(value))}"></span>`;
      }

      function tokenLegendItem(className, label, value) {
        return `<span class="token-legend-item"><span class="token-legend-dot ${className}"></span>${escapeHtml(label)} ${escapeHtml(number(value))}</span>`;
      }

      function tokenBreakdown(title, total, segments) {
        return `<div class="token-breakdown"><div class="token-breakdown-head"><span>${escapeHtml(title)}</span><strong>${escapeHtml(number(total))}</strong></div>
          <div class="token-bar">${segments.map(segment => tokenSegment(segment.className, segment.label, segment.value, total)).join("")}</div>
          <div class="token-legend">${segments.map(segment => tokenLegendItem(segment.className, segment.label, segment.value)).join("")}</div></div>`;
      }

      function tokenDetailsPanel(stats, turns, records) {
        const usageRecords = records.filter(record => hasTokenUsage(record.usage));
        const rawTotal = hasTokenUsage(stats.tokens) ? stats.tokens : aggregateUsage(usageRecords.map(record => record.usage));
        if (!hasTokenUsage(rawTotal)) {
          return `<section class="token-panel" id="tokenDetails"><div class="section-title">${labels.tokenDetails}</div><div class="section-note">${labels.noTokenData}</div></section>`;
        }
        const total = usageView(rawTotal);
        const modelRequests = turns.reduce((sum, turn) => sum + (Number.isFinite(turn.modelCalls) ? turn.modelCalls : usageRecords.filter(record => record.turn === turn.index).length), 0);
        const contextBadge = Number.isFinite(stats.contextWindow) ? `<span class="token-badge">${labels.contextWindow} ${number(stats.contextWindow)}</span>` : "";
        return `<section class="token-panel" id="tokenDetails" aria-labelledby="tokenDetailsTitle">
          <div class="token-head"><div><div class="section-title" id="tokenDetailsTitle">${labels.tokenDetails}</div><div class="section-note">${labels.tokenDetailsNote}</div></div><div class="token-badges"><span class="token-badge">${labels.cacheHit} ${percentage(total.cached, total.input)}</span><span class="token-badge">${labels.modelRequests} ${number(modelRequests)}</span>${contextBadge}</div></div>
          <div class="token-metrics">${tokenMetric("total", labels.totalTokens, total.total)}${tokenMetric("input", labels.inputTokens, total.input)}${tokenMetric("cached", labels.cachedInput, total.cached)}${tokenMetric("uncached", labels.uncachedInput, total.uncached)}${tokenMetric("output", labels.outputTokens, total.output)}${tokenMetric("reasoning", labels.reasoningTokens, total.reasoning)}</div>
          <div class="token-bars">${tokenBreakdown(labels.inputBreakdown, total.input, [{ className: "token-new", label: labels.uncachedInput, value: total.uncached }, { className: "token-cached", label: labels.cachedInput, value: total.cached }])}${tokenBreakdown(labels.outputBreakdown, total.output, [{ className: "token-visible", label: labels.visibleOutput, value: total.visible }, { className: "token-reasoning", label: labels.reasoningTokens, value: total.reasoning }])}</div>
          <details class="token-turns"><summary>${labels.byTurn}</summary><div class="token-table-wrap" role="table"><div class="token-row header" role="row"><div class="token-cell">${labels.turn}</div><div class="token-cell numeric">${labels.calls}</div><div class="token-cell numeric">${labels.totalTokens}</div><div class="token-cell numeric">${labels.inputTokens}</div><div class="token-cell numeric">${labels.cacheHit}</div><div class="token-cell numeric">${labels.outputTokens}</div><div class="token-cell numeric">${labels.reasoningTokens}</div></div><div id="tokenTurnRows"></div></div></details>
        </section>`;
      }

      function drawTokenTurnRows() {
        const container = document.getElementById("tokenTurnRows");
        if (!container || container.dataset.rendered === "true") return;
        const usageRecords = data.records.filter(record => hasTokenUsage(record.usage));
        container.innerHTML = (data.turns || []).map(turn => {
          const raw = hasTokenUsage(turn.usage) ? turn.usage : aggregateUsage(usageRecords.filter(record => record.turn === turn.index).map(record => record.usage));
          if (!hasTokenUsage(raw)) return "";
          const usage = usageView(raw);
          const calls = Number.isFinite(turn.modelCalls) ? turn.modelCalls : usageRecords.filter(record => record.turn === turn.index).length;
          return `<div class="token-row token-turn-row" data-turn="${turn.index}" role="row"><div class="token-cell">T${turn.index}</div><div class="token-cell numeric">${number(calls)}</div><div class="token-cell numeric">${number(usage.total)}</div><div class="token-cell numeric">${number(usage.input)}</div><div class="token-cell numeric">${percentage(usage.cached, usage.input)}</div><div class="token-cell numeric">${number(usage.output)}</div><div class="token-cell numeric">${number(usage.reasoning)}</div></div>`;
        }).join("");
        container.dataset.rendered = "true";
      }

      function recordTokens(record) {
        if (!hasTokenUsage(record.usage)) return { input: "—", cached: "—", output: "—", hasUsage: false };
        const usage = usageView(record.usage);
        return { input: number(usage.uncached), cached: number(usage.cached), output: number(usage.output), hasUsage: true };
      }

      function ledgerTooltipAttribute(value, always = false) {
        if (!value) return "";
        return ` data-ledger-tooltip="${escapeHtml(value)}"${always ? ' data-tooltip-always="true"' : ""}`;
      }

      function hideLedgerTooltip() {
        const tooltip = document.getElementById("ledgerTooltip");
        if (ledgerTooltipTarget) ledgerTooltipTarget.removeAttribute("aria-describedby");
        ledgerTooltipTarget = null;
        if (tooltip) tooltip.hidden = true;
      }

      function showLedgerTooltip(target, force = false) {
        const text = target.dataset.ledgerTooltip;
        const tooltip = document.getElementById("ledgerTooltip");
        if (!text || !tooltip) return;
        const truncated = target.scrollWidth > target.clientWidth + 1 || target.scrollHeight > target.clientHeight + 1;
        if (!force && !truncated) { hideLedgerTooltip(); return; }
        hideLedgerTooltip();
        tooltip.textContent = text;
        tooltip.style.visibility = "hidden";
        tooltip.hidden = false;
        const targetRect = target.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const left = Math.max(12, Math.min(targetRect.left, window.innerWidth - tooltipRect.width - 12));
        let top = targetRect.top - tooltipRect.height - 7;
        if (top < 12) top = Math.min(window.innerHeight - tooltipRect.height - 12, targetRect.bottom + 7);
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
        tooltip.style.visibility = "visible";
        target.setAttribute("aria-describedby", "ledgerTooltip");
        ledgerTooltipTarget = target;
      }

      function bindLedgerTooltips() {
        const ledger = document.getElementById("ledger");
        const wrap = ledger?.parentElement;
        if (!ledger || !wrap) return;
        ledger.addEventListener("pointerover", event => {
          const target = event.target.closest(".event-cell[data-ledger-tooltip], .summary[data-ledger-tooltip]");
          if (target && ledger.contains(target)) showLedgerTooltip(target, target.dataset.tooltipAlways === "true");
        });
        ledger.addEventListener("pointerout", event => {
          if (ledgerTooltipTarget && !ledgerTooltipTarget.contains(event.relatedTarget)) hideLedgerTooltip();
        });
        ledger.addEventListener("focusin", event => {
          const row = event.target.closest("tr.record[data-ledger-tooltip]");
          if (row) showLedgerTooltip(row, true);
        });
        ledger.addEventListener("focusout", hideLedgerTooltip);
        ledger.addEventListener("keydown", event => { if (event.key === "Escape") hideLedgerTooltip(); });
        wrap.addEventListener("scroll", hideLedgerTooltip, { passive: true });
      }

      function liveDelay() {
        if (!liveFailures) return LIVE_INTERVAL_MS;
        return Math.min(LIVE_MAX_BACKOFF_MS, LIVE_INTERVAL_MS * (2 ** liveFailures));
      }

      function scheduleLiveRefresh(delay = LIVE_INTERVAL_MS) {
        stopLiveLoop();
        if (!isLiveMode() || document.hidden) return;
        liveTimer = window.setTimeout(() => {
          liveTimer = null;
          void refreshLiveTrajectory();
        }, delay);
      }

      function startLiveLoop() {
        if (!isLiveMode() || liveBusy || liveTimer !== null) return;
        scheduleLiveRefresh(0);
      }

      async function refreshLiveTrajectory() {
        if (!isLiveMode() || liveBusy || document.hidden || !liveSessionId) return;
        liveBusy = true;
        const sessionId = liveSessionId;
        try {
          const liveArgs = { sessionId, includeArchived: true };
          if (liveRevision) liveArgs.revision = liveRevision;
          const result = await callTool("get_codex_trajectory_update", liveArgs);
          if (!isLiveMode() || liveSessionId !== sessionId) return;
          if (result?.isError) {
            const message = (result.content || []).map(item => item?.text).filter(Boolean).join(" ");
            throw new Error(message || labels.loadError);
          }
          const update = result?.structuredContent;
          if (
            !update
            || update.schemaVersion !== 1
            || typeof update.unchanged !== "boolean"
            || !/^[0-9a-f]{64}$/.test(update.revision || "")
          ) throw new Error(labels.loadError);
          if (!update.unchanged) {
            const trajectory = update.trajectory;
            if (
              trajectory?.session?.id !== sessionId
              || trajectory.detailLevel !== "summary"
              || !Array.isArray(trajectory.records)
            ) throw new Error(labels.loadError);
            const previousLatestId = String(liveData?.records?.at(-1)?.id || "");
            const nextLiveData = safeLiveSnapshot(trajectory);
            const nextLatestId = String(nextLiveData.records?.at(-1)?.id || "");
            if (isDockMode() && nextLatestId && nextLatestId !== previousLatestId) {
              liveMiningRecordId = nextLatestId;
            }
            liveData = nextLiveData;
          }
          liveRevision = update.revision;
          liveCheckedAt = new Date().toISOString();
          liveFailures = 0;
          liveError = null;
        } catch (error) {
          if (isLiveMode() && liveSessionId === sessionId) {
            liveFailures = Math.min(liveFailures + 1, 8);
            liveError = String(error?.message || error);
          }
        } finally {
          liveBusy = false;
          if (isLiveMode()) {
            drawLiveSurface();
            scheduleLiveRefresh(liveDelay());
          }
        }
      }


      function drawShell() {
        document.body.classList.remove("dock-mode");
        const stats = data.stats || {};
        const turns = data.turns || [];
        const pagination = pageState(data);
        const fullDetails = data.detailLevel === "full";
        const totalDuration = turns.reduce((sum, turn) => sum + (Number.isFinite(turn.durationMs) ? turn.durationMs : 0), 0);
        const tokenTotal = hasTokenUsage(stats.tokens) ? usageView(stats.tokens).total : undefined;
        const pipActiveNow = isLiveMode();
        const pipReadyNow = hostDockSupported() || (nativePipSupported() && pipReady);
        const pipButtonTitle = pipActiveNow
          ? labels.exitPip
          : pipReadyNow
            ? labels.livePip
            : pipPreparationError || (nativePipSupported() ? labels.pipPreparing : labels.pipUnavailable);
        const pipButton = '<button id="openPip" type="button" aria-pressed="'
          + String(pipActiveNow) + '" '
          + (presentationBusy || (!pipActiveNow && !pipReadyNow) ? "disabled " : "")
          + 'title="' + escapeHtml(pipButtonTitle) + '">'
          + (pipActiveNow ? labels.exitPip : labels.livePip) + "</button>";
        app.innerHTML = `
          <section class="shell">
            <header class="topbar">
              <div><div class="eyebrow">${labels.eyebrow}</div><h1>${escapeHtml(data.session.title)}</h1><div class="subtitle" title="${escapeHtml(data.session.cwd || "")}">${escapeHtml(data.session.model || "Codex")} · ${escapeHtml(data.session.cwd || data.session.id)}</div></div>
              <div class="top-actions"><select id="sessionSelect" aria-label="${labels.current}"></select>${pipButton}<button id="refresh" type="button">${labels.refresh}</button></div>
            </header>
            <div class="privacy-bar" role="status">
              <div class="privacy-copy"><div><strong>${fullDetails ? labels.fullMode : labels.safeMode}</strong> · ${fullDetails ? labels.fullDescription : labels.safeDescription}</div>${!fullDetails && fullConfirmationOpen ? `<div class="privacy-warning" id="fullDetailsWarning" role="alert">${labels.confirmFull}</div>` : ""}</div>
              ${fullDetails ? "" : fullConfirmationOpen ? `<div class="privacy-actions"><button type="button" id="cancelFull">${labels.cancel}</button><button type="button" class="privacy-action privacy-confirm" id="confirmFull" aria-describedby="fullDetailsWarning">${labels.confirmLoadFull}</button></div>` : `<button type="button" class="privacy-action" id="loadFull">${labels.loadFull}</button>`}
            </div>
            <div class="stats">
              ${stat(labels.turns, number(stats.turns))}${stat(labels.records, number(stats.records))}${stat(labels.tools, number(stats.toolCalls))}
              ${stat(labels.failures, number(stats.failedTools))}${stat(labels.tokens, number(tokenTotal))}${stat(labels.duration, duration(totalDuration))}
            </div>
            ${tokenDetailsPanel(stats, turns, data.records)}
            <section class="overview">
              <div class="section-head"><div><span class="section-title">${labels.overview}</span> <span class="section-note">${labels.hint}</span></div><button id="resetView" type="button">${labels.reset}</button></div>
              <div class="timeline-wrap"><div id="timeline" role="application" aria-label="${labels.overview}"><div id="selection"></div></div><div class="ticks"><span id="tickStart"></span><span id="tickMiddle"></span><span id="tickEnd"></span></div></div>
            </section>
            <div class="toolbar">
              <input id="search" type="search" aria-label="${labels.search}" placeholder="${labels.search}" value="${escapeHtml(search)}">
              <select id="kindFilter" aria-label="${labels.all}"><option value="all">${labels.all}</option>${["user","assistant","reasoning","tool","subagent","compaction"].map(value => `<option value="${value}">${value}</option>`).join("")}</select>
              <span id="rangeChip"></span>
            </div>
            ${pagination.hasEarlier ? `<div class="pagination-bar"><span role="status">${number(data.records.length)} / ${number(stats.records)} ${labels.loadedRecords}</span><button id="loadEarlier" type="button">${labels.loadEarlier}</button></div>` : stats.omittedRecords ? `<div class="notice">${labels.omitted} ${number(stats.omittedRecords)}</div>` : ""}
            ${(data.warnings || []).length ? `<div class="notice" role="status"><strong>${labels.warnings}:</strong> ${escapeHtml(data.warnings.map(item => item.message).join(" "))}</div>` : ""}
            <div class="content"><div class="ledger-wrap"><table id="ledger"><colgroup><col><col><col><col><col><col><col><col></colgroup></table></div><aside class="inspector" id="inspector"></aside></div>
            <div class="ledger-tooltip" id="ledgerTooltip" role="tooltip" hidden></div>
          </section>`;
        populateSessions();
        document.getElementById("kindFilter").value = kind;
        bindControls();
        bindLedgerTooltips();
        drawTimeline();
        drawLedger();
      }

      function populateSessions() {
        const select = document.getElementById("sessionSelect");
        const recent = data.recentSessions || [];
        select.innerHTML = recent.map(session => `<option value="${escapeHtml(session.id)}" ${session.id === data.session.id ? "selected" : ""}>${escapeHtml(session.title)} · ${escapeHtml(session.id.slice(0, 8))}</option>`).join("");
        if (!recent.some(session => session.id === data.session.id)) {
          select.insertAdjacentHTML("afterbegin", `<option value="${escapeHtml(data.session.id)}" selected>${escapeHtml(data.session.title)}</option>`);
        }
      }

      function bindControls() {
        document.getElementById("search").addEventListener("input", event => { search = event.target.value; drawLedger(); });
        document.getElementById("kindFilter").addEventListener("change", event => { kind = event.target.value; drawLedger(); });
        document.getElementById("refresh").addEventListener("click", () => loadSession(data.session.id, data.detailLevel));
        document.getElementById("openPip")?.addEventListener("click", enterPip);
        document.getElementById("sessionSelect").addEventListener("change", event => loadSession(event.target.value, "summary"));
        document.getElementById("loadEarlier")?.addEventListener("click", loadEarlierRecords);
        document.querySelector("details.token-turns")?.addEventListener("toggle", event => {
          if (event.currentTarget.open) drawTokenTurnRows();
        });
        document.getElementById("loadFull")?.addEventListener("click", () => {
          fullConfirmationOpen = true;
          drawShell();
          document.getElementById("confirmFull")?.focus();
        });
        document.getElementById("cancelFull")?.addEventListener("click", () => {
          fullConfirmationOpen = false;
          drawShell();
          document.getElementById("loadFull")?.focus();
        });
        document.getElementById("confirmFull")?.addEventListener("click", () => loadSession(data.session.id, "full"));
        document.getElementById("resetView").addEventListener("click", () => { viewport = { ...fullDomain }; selectedRange = null; drawTimeline(); drawLedger(); });
        const timeline = document.getElementById("timeline");
        timeline.addEventListener("pointerdown", timelinePointerDown);
        timeline.addEventListener("pointermove", timelinePointerMove);
        timeline.addEventListener("pointerup", timelinePointerUp);
        timeline.addEventListener("pointercancel", timelinePointerUp);
        timeline.addEventListener("wheel", timelineWheel, { passive: false });
        timeline.addEventListener("contextmenu", event => { event.preventDefault(); selectedRange = null; drawTimeline(); drawLedger(); });
      }

      async function loadSession(sessionId, detailLevel = "summary") {
        if (busy) return;
        busy = true;
        const refresh = document.getElementById("refresh");
        const sessionSelect = document.getElementById("sessionSelect");
        if (refresh) refresh.disabled = true;
        if (sessionSelect) sessionSelect.disabled = true;
        try {
          app.setAttribute("aria-busy", "true");
          const result = await callTool("get_codex_trajectory", { sessionId, maxRecords: REFRESH_MAX_RECORDS, includeArchived: true, detailLevel });
          if (result?.isError) {
            const message = (result.content || []).map(item => item?.text).filter(Boolean).join(" ");
            throw new Error(message || labels.loadError);
          }
          if (!result?.structuredContent) throw new Error(labels.loadError);
          render(result.structuredContent);
        } catch (error) {
          showLoadError(error);
        } finally {
          busy = false;
          document.getElementById("refresh")?.removeAttribute("disabled");
          document.getElementById("sessionSelect")?.removeAttribute("disabled");
          app.setAttribute("aria-busy", "false");
        }
      }

      async function loadEarlierRecords() {
        if (busy) return;
        const cursor = pageState(data).nextBeforeRecord;
        if (!Number.isFinite(cursor) || cursor <= 1) return;
        busy = true;
        const button = document.getElementById("loadEarlier");
        if (button) {
          button.disabled = true;
          button.textContent = labels.loadingEarlier;
        }
        document.getElementById("refresh")?.setAttribute("disabled", "");
        document.getElementById("sessionSelect")?.setAttribute("disabled", "");
        try {
          app.setAttribute("aria-busy", "true");
          const result = await callTool("get_codex_trajectory", {
            sessionId: data.session.id,
            maxRecords: REFRESH_MAX_RECORDS,
            beforeRecord: cursor,
            includeArchived: true,
            detailLevel: data.detailLevel,
          });
          if (result?.isError) {
            const message = (result.content || []).map(item => item?.text).filter(Boolean).join(" ");
            throw new Error(message || labels.loadError);
          }
          const page = result?.structuredContent;
          const indexes = Array.isArray(page?.records) ? page.records.map(record => record.index) : [];
          const invalidIndexes = indexes.some((index, position) => (
            !Number.isFinite(index)
            || index < 1
            || index >= cursor
            || (position > 0 && index <= indexes[position - 1])
          ));
          if (!page || !indexes.length || invalidIndexes || indexes.at(-1) !== cursor - 1) {
            throw new Error(labels.loadError);
          }
          const merged = mergeEarlierPage(data, page);
          if (merged.records.length <= data.records.length) throw new Error(labels.loadError);
          render(merged, { prepend: true });
        } catch (error) {
          showLoadError(error);
        } finally {
          busy = false;
          document.getElementById("refresh")?.removeAttribute("disabled");
          document.getElementById("sessionSelect")?.removeAttribute("disabled");
          const currentButton = document.getElementById("loadEarlier");
          if (currentButton) {
            currentButton.disabled = false;
            currentButton.textContent = labels.loadEarlier;
          }
          app.setAttribute("aria-busy", "false");
        }
      }

      function showLoadError(error) {
        const message = String(error?.message || error);
        app.querySelectorAll(":scope > .notice.error").forEach(notice => notice.remove());
        app.insertAdjacentHTML("afterbegin", `<div class="notice error" role="alert"><strong>${labels.loadError}:</strong> ${escapeHtml(message)}</div>`);
      }

      function lane(kind) {
        if (kind === "tool" || kind === "subagent") return 2;
        if (kind === "assistant" || kind === "reasoning") return 1;
        return 0;
      }

      function timeToX(time) {
        return ((time - viewport.start) / Math.max(1, viewport.end - viewport.start)) * 100;
      }

      function xToTime(clientX) {
        const rect = document.getElementById("timeline").getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        return viewport.start + ratio * (viewport.end - viewport.start);
      }

      function drawTimeline() {
        const timeline = document.getElementById("timeline");
        if (!timeline) return;
        timeline.querySelectorAll(".span,.turn-boundary").forEach(node => node.remove());
        for (const turn of data.turns || []) {
          const start = Date.parse(turn.startedAt || "");
          if (!Number.isFinite(start) || start < viewport.start || start > viewport.end) continue;
          const boundary = document.createElement("div");
          boundary.className = "turn-boundary";
          boundary.style.left = `${timeToX(start)}%`;
          boundary.title = `${labels.turn} ${turn.index}`;
          timeline.appendChild(boundary);
        }
        for (const record of data.records) {
          const range = recordRange(record);
          if (!range || range.end < viewport.start || range.start > viewport.end) continue;
          const start = Math.max(range.start, viewport.start);
          const end = Math.min(range.end, viewport.end);
          const span = document.createElement("button");
          span.type = "button";
          span.className = `span ${record.status === "error" ? "error" : ""} ${record.index === selectedIndex ? "selected" : ""}`;
          span.dataset.kind = record.kind;
          span.style.left = `${Math.max(0, timeToX(start))}%`;
          span.style.width = `${Math.max(.35, timeToX(end) - timeToX(start))}%`;
          span.style.top = `${8 + lane(record.kind) * 27}px`;
          span.title = `#${record.index} ${record.event} · ${duration(record.durationMs)}`;
          span.addEventListener("click", event => { event.stopPropagation(); selectRecord(record.index); });
          timeline.appendChild(span);
        }
        const selection = document.getElementById("selection");
        if (selectedRange) {
          selection.style.display = "block";
          selection.style.left = `${timeToX(selectedRange.start)}%`;
          selection.style.width = `${Math.max(.2, timeToX(selectedRange.end) - timeToX(selectedRange.start))}%`;
        } else selection.style.display = "none";
        document.getElementById("tickStart").textContent = date(viewport.start);
        document.getElementById("tickMiddle").textContent = `+${duration((viewport.end - viewport.start) / 2)}`;
        document.getElementById("tickEnd").textContent = `+${duration(viewport.end - viewport.start)}`;
        const chip = document.getElementById("rangeChip");
        chip.className = selectedRange ? "range-chip" : "";
        chip.textContent = selectedRange ? `${labels.range}: ${duration(selectedRange.end - selectedRange.start)}` : "";
      }

      function timelinePointerDown(event) {
        if (event.target.classList.contains("span")) return;
        event.currentTarget.setPointerCapture(event.pointerId);
        if (event.button === 2) {
          drag = { mode: "pan", x: event.clientX, viewport: { ...viewport } };
        } else if (event.button === 0) {
          const at = xToTime(event.clientX);
          drag = { mode: "select", start: at, current: at };
          selectedRange = { start: at, end: at };
          drawTimeline();
        }
      }

      function timelinePointerMove(event) {
        if (!drag) return;
        if (drag.mode === "select") {
          drag.current = xToTime(event.clientX);
          selectedRange = { start: Math.min(drag.start, drag.current), end: Math.max(drag.start, drag.current) };
          drawTimeline();
          return;
        }
        const rect = event.currentTarget.getBoundingClientRect();
        const delta = ((event.clientX - drag.x) / rect.width) * (drag.viewport.end - drag.viewport.start);
        const width = drag.viewport.end - drag.viewport.start;
        let start = drag.viewport.start - delta;
        start = Math.max(fullDomain.start, Math.min(fullDomain.end - width, start));
        viewport = { start, end: start + width };
        drawTimeline();
      }

      function timelinePointerUp() {
        if (drag?.mode === "select" && selectedRange && selectedRange.end - selectedRange.start < 2) selectedRange = null;
        drag = null;
        drawTimeline();
        drawLedger();
      }

      function timelineWheel(event) {
        event.preventDefault();
        const anchor = xToTime(event.clientX);
        const currentWidth = viewport.end - viewport.start;
        const fullWidth = fullDomain.end - fullDomain.start;
        const minimumWidth = Math.min(10, fullWidth);
        const nextWidth = Math.max(minimumWidth, Math.min(fullWidth, currentWidth * Math.exp(event.deltaY * .0015)));
        const ratio = (anchor - viewport.start) / currentWidth;
        let start = anchor - nextWidth * ratio;
        start = Math.max(fullDomain.start, Math.min(fullDomain.end - nextWidth, start));
        viewport = { start, end: start + nextWidth };
        drawTimeline();
      }

      function visibleRecords() {
        const needle = search.trim().toLowerCase();
        return data.records.filter(record => {
          if (kind !== "all" && record.kind !== kind) return false;
          if (selectedRange) {
            const range = recordRange(record);
            if (!range || range.end < selectedRange.start || range.start > selectedRange.end) return false;
          }
          if (!needle) return true;
          return [record.event, record.summary, record.input, record.output, record.callId, JSON.stringify(record.usage || {})].some(value => String(value || "").toLowerCase().includes(needle));
        });
      }

      function drawLedger() {
        const ledger = document.getElementById("ledger");
        if (!ledger) return;
        hideLedgerTooltip();
        const records = visibleRecords();
        const filtering = Boolean(search.trim() || kind !== "all" || selectedRange);
        const groups = [];
        for (const record of records) {
          let group = groups.at(-1);
          if (!group || group.turn !== record.turn) {
            group = { turn: record.turn, records: [] };
            groups.push(group);
          }
          group.records.push(record);
        }
        const previousScrollTop = ledger.parentElement?.scrollTop || 0;
        ledger.querySelectorAll("tbody").forEach(group => group.remove());
        for (const group of groups) {
          const turn = (data.turns || []).find(item => item.index === group.turn) || {};
          const expanded = filtering || expandedTurns.has(group.turn);
          const turnGroup = document.createElement("tbody");
          turnGroup.className = "turn-group";
          turnGroup.dataset.turn = group.turn;
          const header = document.createElement("tr");
          header.className = `turn-row ${expanded ? "expanded" : "collapsed"}`;
          header.dataset.turn = group.turn;
          const recordCount = Number.isFinite(turn.records) ? turn.records : group.records.length;
          const toggleLabel = expanded ? labels.collapseTurn : labels.expandTurn;
          const model = turn.model || data.session.model;
          const modelSummary = model ? ` · <span class="turn-model">${labels.modelLabel} ${escapeHtml(model)}</span>` : "";
          const turnUsage = hasTokenUsage(turn.usage) ? usageView(turn.usage) : null;
          const turnToken = (kind, label, value) => {
            return `<td class="turn-token" data-turn-token-kind="${kind}"><span class="turn-token-label">${label}</span><span class="turn-token-value">${number(value)}</span></td>`;
          };
          header.innerHTML = `<td class="turn-summary-cell" colspan="5"><button type="button" class="turn-toggle" data-turn="${group.turn}" aria-expanded="${expanded}" title="${escapeHtml(toggleLabel)}"><span class="turn-caret" aria-hidden="true">${expanded ? "▾" : "▸"}</span><span class="turn-copy"><span class="turn-title">${labels.turn} ${group.turn}</span><span class="turn-meta">${escapeHtml(turn.status || "")} · ${number(recordCount)} ${labels.records} · ${duration(turn.durationMs)}${Number.isFinite(turn.timeToFirstTokenMs) ? ` · TTFT ${duration(turn.timeToFirstTokenMs)}` : ""}${modelSummary}</span></span></button></td>${turnToken("uncached", labels.uncachedInput, turnUsage?.uncached)}${turnToken("cached", labels.cachedInput, turnUsage?.cached)}${turnToken("output", labels.outputTokens, turnUsage?.output)}`;
          turnGroup.appendChild(header);
          ledger.appendChild(turnGroup);
          if (!expanded) continue;
          const columnHeader = document.createElement("tr");
          columnHeader.className = "turn-column-row";
          const columnHeading = label => `<th scope="col" title="${escapeHtml(label)}">${escapeHtml(label)}</th>`;
          columnHeader.innerHTML = [labels.index, labels.step, labels.event, labels.summary, labels.time, labels.uncachedInput, labels.cachedInput, labels.outputTokens].map(columnHeading).join("");
          turnGroup.appendChild(columnHeader);
          for (const record of group.records) {
            const row = document.createElement("tr");
            row.className = `record ${record.index === selectedIndex ? "selected" : ""}`;
            row.dataset.id = record.id;
            row.dataset.index = record.index;
            row.dataset.ledgerTooltip = `${labels.event}: ${record.event}\n${labels.summary}: ${record.summary}`;
            row.tabIndex = 0;
            const tokens = recordTokens(record);
            const tokenClass = `record-token ${tokens.hasUsage ? "has-usage" : ""}`;
            row.innerHTML = `<td class="index">#${record.index}</td><td class="mono">${record.step ? `S${record.step}` : "—"}</td><td class="event-cell"${ledgerTooltipAttribute(record.event, true)}><div class="event"><span class="dot ${escapeHtml(record.kind)}"></span><span class="event-name ${record.status === "error" ? "status-error" : record.status === "running" ? "status-running" : ""}">${escapeHtml(record.event)}</span></div></td><td class="summary"${ledgerTooltipAttribute(record.summary, true)}>${escapeHtml(record.summary)}</td><td class="duration">${duration(record.durationMs)}</td><td class="${tokenClass}" data-token-kind="uncached">${escapeHtml(tokens.input)}</td><td class="${tokenClass}" data-token-kind="cached">${escapeHtml(tokens.cached)}</td><td class="${tokenClass}" data-token-kind="output">${escapeHtml(tokens.output)}</td>`;
            row.addEventListener("click", () => selectRecord(record.index));
            row.addEventListener("keydown", event => {
              if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectRecord(record.index); }
            });
            turnGroup.appendChild(row);
          }
        }
        if (!records.length) {
          const emptyGroup = document.createElement("tbody");
          const row = document.createElement("tr");
          row.innerHTML = `<td colspan="8"><div class="empty">${labels.noMatch}</div></td>`;
          emptyGroup.appendChild(row);
          ledger.appendChild(emptyGroup);
        }
        ledger.querySelectorAll(".turn-row").forEach(row => row.addEventListener("click", () => {
          const turn = Number(row.dataset.turn);
          if (!Number.isFinite(turn)) return;
          if (expandedTurns.has(turn)) expandedTurns.delete(turn); else expandedTurns.add(turn);
          drawLedger();
        }));
        if (ledger.parentElement) ledger.parentElement.scrollTop = previousScrollTop;
        drawInspector();
      }

      function selectRecord(index) {
        const record = data.records.find(item => item.index === index);
        if (record) expandedTurns.add(record.turn);
        selectedIndex = index;
        drawTimeline();
        drawLedger();
        document.querySelector(`tr[data-index="${index}"]`)?.scrollIntoView({ block: "nearest" });
      }

      function detailSection(title, value, open = false) {
        if (!value) return "";
        return `<details ${open ? "open" : ""}><summary>${escapeHtml(title)}</summary><pre>${escapeHtml(value)}</pre></details>`;
      }

      function drawInspector() {
        const inspector = document.getElementById("inspector");
        if (!inspector) return;
        const record = data.records.find(item => item.index === selectedIndex);
        if (!record) { inspector.innerHTML = `<div class="empty">${labels.inspect}</div>`; return; }
        const usage = record.usage ? JSON.stringify(record.usage, null, 2) : "";
        const metadata = record.metadata && Object.keys(record.metadata).length ? JSON.stringify(record.metadata, null, 2) : "";
        inspector.innerHTML = `<h2>#${record.index} ${escapeHtml(record.event)}</h2><div class="inspect-meta">T${record.turn}${record.step ? ` / S${record.step}` : ""} · <span class="${record.status === "error" ? "status-error" : record.status === "running" ? "status-running" : ""}">${escapeHtml(record.status)}</span></div>
          <div class="inspect-grid">
            <div class="inspect-item"><span>${labels.time}</span><strong>${duration(record.durationMs)}</strong></div>
            <div class="inspect-item"><span>${labels.callId}</span><strong title="${escapeHtml(record.callId || "")}">${escapeHtml(record.callId || "—")}</strong></div>
            <div class="inspect-item"><span>${labels.started}</span><strong>${escapeHtml(date(record.startedAt))}</strong></div>
            <div class="inspect-item"><span>${labels.completed}</span><strong>${escapeHtml(date(record.completedAt))}</strong></div>
          </div>
          <div>${escapeHtml(record.summary)}</div>
          ${record.error ? detailSection(labels.status, record.error, true) : ""}
          ${detailSection(labels.input, record.input, true)}${detailSection(labels.output, record.output, true)}${detailSection(labels.usage, usage)}${detailSection(labels.metadata, metadata)}`;
      }

      window.addEventListener("openai:set_globals", event => {
        const globals = event?.detail?.globals || event?.detail || {};
        const nextMode = globals.displayMode;
        if (nextMode !== "inline" && nextMode !== "fullscreen") return;
        displayMode = nextMode;
        if (!isDockMode()) return;
        if (nextMode === "fullscreen") drawDockedShell();
        else finishLiveWindow(true);
      });

      window.addEventListener("message", event => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && pending.has(message.id)) {
          const handler = pending.get(message.id);
          pending.delete(message.id);
          window.clearTimeout(handler.timeout);
          if (message.error) handler.reject(message.error); else handler.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result" && message.params?.structuredContent) render(message.params.structuredContent);
      }, { passive: true });

      document.addEventListener("visibilitychange", () => {
        if (!isLiveMode()) return;
        stopLiveLoop();
        drawLiveSurface();
        if (!document.hidden) startLiveLoop();
      });

      const initial = window.openai?.toolOutput;
      if (initial?.session) render(initial);
    })();
  </script>
</body>
</html>
