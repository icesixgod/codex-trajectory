<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex Trajectory</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f7;
      --panel: #ffffff;
      --panel-2: rgb(242, 242, 242);
      --line: rgba(0, 0, 0, .084);
      --line-strong: rgba(0, 0, 0, .156);
      --text: #202020;
      --muted: rgba(0, 0, 0, .55);
      --accent: rgb(0, 102, 204);
      --accent-soft: #e6f2ff;
      --danger: #d93025;
      --success: #16833b;
      --user: #006acc;
      --assistant: #7847c7;
      --reasoning: #7847c7;
      --tool: #b65d00;
      --subagent: #16833b;
      --compaction: rgba(0, 0, 0, .55);
      --token-new: #006acc;
      --token-cached: #16833b;
      --token-visible: #7847c7;
      --token-reasoning: #7847c7;
      --shadow: 0 8px 28px rgba(0, 0, 0, .07);
    }
    :root[data-codex-theme="dark"] {
      color-scheme: dark;
      --bg: #141414;
      --panel: #181818;
      --panel-2: rgb(40, 40, 40);
      --line: rgba(255, 255, 255, .084);
      --line-strong: rgba(255, 255, 255, .156);
      --text: #dfdfdf;
      --muted: rgba(255, 255, 255, .498);
      --accent: rgb(131, 195, 255);
      --accent-soft: #0d273f;
      --danger: #ff6764;
      --success: #40c977;
      --user: #339cff;
      --assistant: #ad7bf9;
      --reasoning: #ad7bf9;
      --tool: #ff8549;
      --subagent: #40c977;
      --compaction: rgba(255, 255, 255, .498);
      --token-new: #339cff;
      --token-cached: #40c977;
      --token-visible: #ad7bf9;
      --token-reasoning: #ad7bf9;
      --shadow: 0 10px 30px rgba(0, 0, 0, .24);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-codex-theme]) {
        color-scheme: dark;
        --bg: #141414;
        --panel: #181818;
        --panel-2: rgb(40, 40, 40);
        --line: rgba(255, 255, 255, .084);
        --line-strong: rgba(255, 255, 255, .156);
        --text: #dfdfdf;
        --muted: rgba(255, 255, 255, .498);
        --accent: rgb(131, 195, 255);
        --accent-soft: #0d273f;
        --danger: #ff6764;
        --success: #40c977;
        --user: #339cff;
        --assistant: #ad7bf9;
        --reasoning: #ad7bf9;
        --tool: #ff8549;
        --subagent: #40c977;
        --compaction: rgba(255, 255, 255, .498);
        --token-new: #339cff;
        --token-cached: #40c977;
        --token-visible: #ad7bf9;
        --token-reasoning: #ad7bf9;
        --shadow: 0 10px 30px rgba(0, 0, 0, .24);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; color: inherit; }
    button, select, input {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }
    button { cursor: pointer; padding: 6px 10px; }
    button:hover { border-color: var(--line-strong); background: var(--panel-2); }
    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
    #app { min-height: 240px; padding: 12px; }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 3px 0 2px; font-size: 20px; line-height: 1.2; }
    .subtitle { max-width: 720px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-actions { display: flex; gap: 7px; align-items: center; }
    #sessionSelect { width: min(360px, 38vw); padding: 7px 30px 7px 9px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(84px, 1fr));
      gap: 8px;
      padding: 12px 18px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }
    .privacy-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent-soft) 55%, var(--panel)); }
    .privacy-copy { min-width: 0; color: var(--muted); }
    .privacy-copy strong { color: var(--text); }
    .privacy-warning { margin-top: 4px; color: var(--text); }
    .privacy-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .privacy-action { white-space: nowrap; }
    .privacy-confirm { color: #fff; border-color: var(--accent); background: var(--accent); }
    .privacy-confirm:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 88%, #000); }
    .integration-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .integration-copy { min-width: 0; }
    .integration-title { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 750; }
    .integration-experimental { padding: 2px 5px; border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-size: 9px; font-weight: 750; text-transform: uppercase; }
    .integration-status { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .integration-status.error { color: var(--danger); }
    .integration-status.active { color: var(--success); }
    .integration-controls { display: flex; flex: none; align-items: center; gap: 9px; }
    .integration-switch { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .integration-switch input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
    .integration-port { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .integration-port input { width: 74px; padding: 4px 6px; font-variant-numeric: tabular-nums; }
    .integration-help { margin-top: 4px; color: var(--muted); font-size: 9px; }
    .integration-help code { user-select: all; color: var(--text); font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stat { min-width: 0; padding: 7px 9px; border-radius: 9px; background: color-mix(in srgb, var(--panel) 82%, transparent); }
    .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .stat-value { margin-top: 2px; font-size: 15px; font-weight: 700; white-space: nowrap; }
    .token-panel { padding: 13px 18px 15px; border-bottom: 1px solid var(--line); }
    .token-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .token-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .token-badge { padding: 3px 7px; border-radius: 999px; color: var(--muted); background: var(--panel-2); font-size: 10px; white-space: nowrap; }
    .token-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 7px; }
    .token-metric { min-width: 0; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; }
    .token-metric-label { color: var(--muted); font-size: 10px; }
    .token-metric-value { margin-top: 2px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.025em; white-space: nowrap; }
    .number-long { font-size: 12px; }
    .number-xlong { font-size: 10px; letter-spacing: -.045em; }
    .token-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 9px; }
    .token-breakdown { padding: 9px; border-radius: 9px; background: var(--panel-2); }
    .token-breakdown-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 11px; }
    .token-breakdown-head strong { font-variant-numeric: tabular-nums; }
    .token-bar { display: flex; height: 9px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--line) 72%, transparent); }
    .token-segment { min-width: 2px; height: 100%; }
    .token-new { background: var(--token-new); }
    .token-cached { background: var(--token-cached); }
    .token-visible { background: var(--token-visible); }
    .token-reasoning { background: var(--token-reasoning); }
    .token-legend { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .token-legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .token-legend-dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
    .token-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; scrollbar-gutter: stable; }
    .token-row { display: grid; grid-template-columns: 74px 82px repeat(5, minmax(160px, 1fr)); min-width: 960px; border-top: 1px solid var(--line); }
    .token-row:first-child { border-top: 0; }
    .token-cell { min-width: 0; padding: 7px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .token-cell.numeric { overflow: visible; text-align: right; text-overflow: clip; font-size: 11px; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .token-row.header { color: var(--muted); background: var(--panel-2); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .token-turns { margin-top: 10px; }
    .token-turns > summary { font-size: 11px; }
    .token-turns .token-table-wrap { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
    .overview { padding: 12px 18px 14px; border-bottom: 1px solid var(--line); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .section-title { font-weight: 700; }
    .section-note { color: var(--muted); font-size: 11px; }
    .timeline-wrap { position: relative; }
    #timeline {
      position: relative;
      height: 92px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background:
        linear-gradient(to bottom, transparent 31%, var(--line) 31%, var(--line) 32%, transparent 32%, transparent 65%, var(--line) 65%, var(--line) 66%, transparent 66%),
        repeating-linear-gradient(to right, transparent 0, transparent calc(10% - 1px), color-mix(in srgb, var(--line) 65%, transparent) calc(10% - 1px), color-mix(in srgb, var(--line) 65%, transparent) 10%);
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }
    .turn-boundary { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-strong); opacity: .7; }
    .span { position: absolute; height: 16px; min-width: 3px; border-radius: 4px; opacity: .88; border: 1px solid color-mix(in srgb, currentColor 70%, #0000); cursor: pointer; }
    .span:hover, .span.selected { opacity: 1; outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); z-index: 4; }
    .span[data-kind="user"] { background: var(--user); color: var(--user); }
    .span[data-kind="assistant"] { background: var(--assistant); color: var(--assistant); }
    .span[data-kind="reasoning"] { background: var(--reasoning); color: var(--reasoning); }
    .span[data-kind="tool"] { background: var(--tool); color: var(--tool); }
    .span[data-kind="subagent"] { background: var(--subagent); color: var(--subagent); }
    .span[data-kind="compaction"] { background: var(--compaction); color: var(--compaction); }
    .span.error { box-shadow: inset 0 0 0 2px var(--danger); }
    #selection {
      position: absolute;
      top: 0;
      bottom: 0;
      display: none;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-left: 1px solid var(--accent);
      border-right: 1px solid var(--accent);
      pointer-events: none;
      z-index: 3;
    }
    .ticks { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 10px; }
    .toolbar { display: flex; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); align-items: center; }
    #search { flex: 1; min-width: 120px; padding: 7px 10px; }
    #kindFilter { padding: 7px 9px; }
    .range-chip { padding: 5px 8px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; white-space: nowrap; }
    .content { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 360px; }
    .ledger-wrap { min-width: 0; max-height: 560px; padding-inline: 18px; overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable; }
    table { width: 100%; min-width: 0; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    col:nth-child(1) { width: 7%; }
    col:nth-child(2) { width: 8%; }
    col:nth-child(3) { width: 16%; }
    col:nth-child(4) { width: 15%; }
    col:nth-child(5) { width: 9%; }
    col:nth-child(6), col:nth-child(7), col:nth-child(8) { width: 15%; }
    th { color: var(--muted); text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 7px 8px; }
    th:nth-child(1) { width: 7%; }
    th:nth-child(2) { width: 8%; }
    th:nth-child(3) { width: 16%; }
    th:nth-child(4) { width: 15%; }
    th:nth-child(5) { width: 9%; text-align: right; }
    th:nth-child(6), th:nth-child(7), th:nth-child(8) { width: 15%; text-align: right; }
    td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.record { cursor: pointer; }
    tr.record:hover td { background: var(--panel-2); }
    tr.record.selected td { background: var(--accent-soft); }
    .turn-group { position: relative; }
    .turn-row { cursor: pointer; }
    .turn-row td { padding: 0; border-top: 2px solid var(--line-strong); border-bottom: 1px solid var(--line); color: var(--muted); background: color-mix(in srgb, var(--panel-2) 68%, transparent); }
    .turn-row:hover td { color: var(--text); background: var(--panel-2); }
    .turn-toggle { display: flex; width: 100%; min-height: 44px; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 0; color: inherit; background: transparent; text-align: left; }
    .turn-toggle:hover { color: var(--text); }
    .turn-toggle:focus-visible { position: relative; z-index: 1; outline: 2px solid var(--accent); outline-offset: -2px; }
    .turn-caret { width: 11px; flex: none; color: var(--accent); text-align: center; }
    .turn-copy { min-width: 0; }
    .turn-title { display: block; color: var(--text); font-size: 12px; font-weight: 750; }
    .turn-meta { display: block; margin-top: 1px; overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .turn-row .turn-token { padding: 6px 8px; vertical-align: middle; text-align: right; }
    .turn-token-label { display: block; overflow: hidden; font-size: 9px; font-weight: 700; letter-spacing: .035em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .turn-token-value { display: block; margin-top: 2px; color: var(--text); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .turn-column-row { position: sticky; top: 0; z-index: 5; }
    .turn-column-row th { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); box-shadow: 0 1px var(--line); text-overflow: ellipsis; white-space: nowrap; }
    .turn-summary-cell + .turn-token, .turn-column-row th:nth-child(6), tr.record td:nth-child(6) { border-left: 1px solid var(--line); }
    .index, .duration, .record-token, .mono { overflow: hidden; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .duration { text-align: right; color: var(--muted); }
    .record-token { text-align: right; color: var(--muted); }
    .record-token.has-usage { color: var(--text); font-weight: 650; }
    .event { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--compaction); }
    .dot.user { background: var(--user); }
    .dot.assistant { background: var(--assistant); }
    .dot.reasoning { background: var(--reasoning); }
    .dot.tool { background: var(--tool); }
    .dot.subagent { background: var(--subagent); }
    .event-name, .summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-name { min-width: 0; }
    .event-cell[data-ledger-tooltip], .summary[data-ledger-tooltip] { cursor: help; }
    .ledger-tooltip { position: fixed; z-index: 30; max-width: min(460px, calc(100vw - 24px)); padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 9px; color: var(--text); background: var(--panel); box-shadow: var(--shadow); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; pointer-events: none; white-space: pre-wrap; }
    .ledger-tooltip[hidden] { display: none; }
    .status-error { color: var(--danger); }
    .status-running { color: var(--accent); }
    .inspector { border-left: 1px solid var(--line); max-height: 560px; overflow: auto; padding: 14px; scrollbar-gutter: stable; }
    .empty { display: grid; min-height: 280px; place-items: center; color: var(--muted); text-align: center; padding: 30px; }
    .inspector h2 { margin: 0 0 4px; font-size: 15px; }
    .inspect-meta { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
    .inspect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
    .inspect-item { padding: 7px; background: var(--panel-2); border-radius: 8px; min-width: 0; }
    .inspect-item span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .inspect-item strong { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details { margin-top: 9px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    summary { cursor: pointer; padding: 8px 10px; font-weight: 650; background: var(--panel-2); }
    pre { margin: 0; padding: 10px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .notice { margin: 10px 18px; padding: 8px 10px; border-radius: 8px; color: var(--muted); background: var(--panel-2); }
    .notice.error { color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
    .pagination-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 18px; padding: 8px 10px; border-radius: 8px; color: var(--muted); background: var(--panel-2); }
    .pagination-bar button { flex: none; color: var(--text); background: var(--panel); }
    .loading { min-height: 260px; display: grid; place-items: center; color: var(--muted); }
    .spinner { width: 20px; height: 20px; margin: 0 auto 8px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    #openPip[aria-pressed="true"] {
      color: #fff;
      border-color: var(--success);
      background: var(--success);
    }
    #nativePipMedia {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: .001;
      pointer-events: none;
    }
    #nativePipMedia canvas, #nativePipMedia video {
      display: block;
      width: 1px;
      height: 1px;
    }
    body.dock-mode {
      min-height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    body.dock-mode #app {
      min-height: 100vh;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .dock-shell {
      position: fixed;
      inset: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: var(--panel);
      pointer-events: auto;
    }
    .dock-fixed {
      position: relative;
      z-index: 2;
      flex: none;
      border-bottom: 1px solid var(--line-strong);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    }
    .dock-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px 10px;
    }
    .dock-head-copy { min-width: 0; flex: 1; }
    .dock-kicker { color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .dock-title { max-width: 100%; margin-top: 3px; overflow: hidden; font-size: 15px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .dock-head-actions { display: flex; flex: none; align-items: flex-start; gap: 8px; }
    .dock-quota {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
      border-radius: 9px;
      background: color-mix(in srgb, var(--accent-soft) 52%, var(--panel));

        const running = latestTurn?.status === "running" || latestTurn?.status === "inProgress";

        if (running) {
