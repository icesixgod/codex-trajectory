        const quotaElement = document.getElementById("dockQuota");
        if (quotaElement) {
          if (languageChanged || quotaElement.dataset.quota !== quota.signature || quotaElement.dataset.sampleNote !== quota.sampleNote) {
            quotaElement.innerHTML = dockQuotaMarkup(quota);
            quotaElement.dataset.quota = quota.signature;
            quotaElement.dataset.sampleNote = quota.sampleNote;
          }
          quotaElement.hidden = quota.items.length === 0;
          setDockAttribute(quotaElement, "aria-label", quota.aria);
          setDockAttribute(quotaElement, "title", quota.title);
        }
        setDockText("#dockOverviewMeta", number(stats.turns) + " " + labels.turns + " · " + number(stats.records) + " " + labels.records);
        setDockText("#dockTotalValue", number(tokenItems[0][1]));
        setDockText("#dockTotalCost", totalCost);
        setDockText("#dockCostMode", fastCostLabel(snapshot));
        setDockAttribute(document.getElementById("dockTotalCostMetric"), "title", totalCostNote);
        tokenItems.slice(1).forEach((item, index) => {
          setDockText(`[data-dock-token="${index + 1}"] .dock-token-label`, item[0]);
          setDockText(`[data-dock-token="${index + 1}"] .dock-token-value`, number(item[1]));
        });
        setDockText("#dockStreamMeta", number(records.length) + " " + labels.recentRecords + " · " + labels.latestBelow);
        setDockText("#dockChecked", labels.checked + ": " + (liveCheckedAt ? date(liveCheckedAt) : "—"));

        const stream = document.getElementById("liveRecordStream");
        if (!stream) return;
        bindDockStream(stream);
        const revision = liveRevision || "";
        if (stream.dataset.revision === revision && stream.dataset.language === language) return;
        dockScrollTop = stream.scrollTop;
        const anchor = Array.from(stream.querySelectorAll(".dock-record"))
          .find(element => element.getBoundingClientRect().bottom > stream.getBoundingClientRect().top);
        const anchorIndex = anchor?.dataset.index;
        const anchorOffset = anchor ? anchor.getBoundingClientRect().top - stream.getBoundingClientRect().top : 0;
        const focusedId = stream.contains(document.activeElement)
          ? document.activeElement.closest(".dock-record-expand")?.dataset.recordId : null;
        stream.innerHTML = dockRecordRows(records, snapshot.turns);
        stream.dataset.revision = revision;
        stream.dataset.language = language;
        stream.dataset.followLatest = String(dockFollowLatest);
        bindDockWhaleMiner(stream);
        if (dockFollowLatest) stream.scrollTop = stream.scrollHeight;
        else {
          const retained = Array.from(stream.querySelectorAll(".dock-record"))
            .find(element => element.dataset.index === anchorIndex);
          if (retained) stream.scrollTop += retained.getBoundingClientRect().top - stream.getBoundingClientRect().top - anchorOffset;
          else stream.scrollTop = 0;
        }
        if (focusedId) {
          Array.from(stream.querySelectorAll(".dock-record-expand"))
            .find(element => element.dataset.recordId === focusedId)
            ?.querySelector(".dock-record-toggle")?.focus({ preventScroll: true });
        }
      }

      function drawDockedShell() {
        const view = liveViewState();
        if (!view) return;
        if (document.getElementById("liveDock")) patchDockedShell(view);
        else mountDockedShell(view);
      }

      function drawLiveSurface() {
        if (isDockMode()) drawDockedShell();
        else drawPipCanvas();
      }

      function updatePipButton() {
        const button = document.getElementById("openPip");
        if (!button) return;
        const active = isLiveMode();
        const ready = true;
        button.textContent = active ? labels.exitPip : labels.livePip;
        button.setAttribute("aria-pressed", String(active));
        button.disabled = busy || presentationBusy || (!active && !ready);
        button.title = active
          ? labels.exitPip
          : hostDockSupported() || pipReady
            ? labels.livePip
            : pipPreparationError || (nativePipSupported() ? labels.pipPreparing : labels.pipUnavailable);
      }

      function prepareNativePipMedia(force = false) {
        if ((!force && hostDockSupported()) || pipVideo || !nativePipSupported()) {
          updatePipButton();
          return pipVideo;
        }
        try {
          const holder = document.createElement("div");
          holder.id = "nativePipMedia";
          holder.setAttribute("aria-hidden", "true");
          const canvas = document.createElement("canvas");
          canvas.id = "pipCanvas";
          canvas.width = PIP_CANVAS_WIDTH;
          canvas.height = PIP_CANVAS_HEIGHT;
          const video = document.createElement("video");
          video.id = "pipVideo";
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.disablePictureInPicture = false;
          holder.append(canvas, video);
          document.body.append(holder);
          pipCanvas = canvas;
          pipVideo = video;
          drawPipCanvas();

          const markReady = () => {
            if (!pipVideo || pipVideo.readyState < HTMLMediaElement.HAVE_METADATA) return;
            pipReady = true;
            pipPreparationError = null;
            updatePipButton();
          };
          video.addEventListener("loadedmetadata", markReady);
          video.addEventListener("canplay", markReady);
          video.addEventListener("enterpictureinpicture", () => activateNativePip());
          video.addEventListener("leavepictureinpicture", () => finishNativePip(true));
          pipStream = canvas.captureStream(1);
          video.srcObject = pipStream;
          const playback = video.play();
          if (playback?.catch) playback.catch(error => {
            pipPreparationError = String(error?.message || error);
            updatePipButton();
          });
          markReady();
          return video;
        } catch (error) {
          pipPreparationError = String(error?.message || error);
          pipReady = false;
          updatePipButton();
          return null;
        }
      }

      function stopLiveLoop() {
        if (liveTimer !== null) window.clearTimeout(liveTimer);
        liveTimer = null;
      }

      function activateNativePip() {
        if (!liveData && data) liveData = safeLiveSnapshot(data);
        if (!liveSessionId && data) liveSessionId = data.session.id;
        livePresentation = "native-pip";
        pipActive = true;
        document.body.classList.remove("dock-mode");
        if (pipVideo) pipVideo.dataset.active = "true";
        drawPipCanvas();
        updatePipButton();
        startLiveLoop();
      }

      function activateDockedWindow(presentation = "docked") {
        if (!liveData && data) liveData = safeLiveSnapshot(data);
        if (!liveSessionId && data) liveSessionId = data.session.id;
        livePresentation = presentation;
        dockFollowLatest = true;
        dockScrollTop = 0;
        pipActive = false;
        if (pipVideo) pipVideo.dataset.active = "false";
        drawDockedShell();
        startLiveLoop();
      }

      function finishLiveWindow(reload) {
        const wasActive = isLiveMode() || liveSessionId !== null;
        const sessionId = liveSessionId;
        const detailLevel = restoreDetailLevel;
        livePresentation = "none";
        pipActive = false;
        pipWindow = null;
        if (pipVideo) pipVideo.dataset.active = "false";
        stopLiveLoop();
        liveData = null;
        liveSessionId = null;
        liveRevision = null;
        liveCheckedAt = null;
        liveError = null;
        liveFailures = 0;
        liveMiningRecordId = null;
        expandedLiveRecords.clear();
        dockFollowLatest = true;
        dockScrollTop = 0;
        document.body.classList.remove("dock-mode");
        drawPipCanvas();
        if (data) drawShell();
        if (reload && wasActive && !busy && data?.session?.id === sessionId) {
          void loadSession(sessionId, detailLevel);
        }
      }

      function finishNativePip(reload) {
        if (isDockMode()) return;
        finishLiveWindow(reload);
      }

      async function enterPip() {
        if (!data || busy || presentationBusy) return;
        if (isLiveMode()) {
          await exitPip();
          return;
        }
        restoreDetailLevel = fullDetailsEnabled ? "full" : "summary";
        restoreDisplayMode = displayMode;
        liveData = safeLiveSnapshot(data);
        liveSessionId = data.session.id;
        liveRevision = null;
        liveCheckedAt = null;
        liveFailures = 0;
        liveError = null;
        liveMiningRecordId = null;
        expandedLiveRecords.clear();
        presentationBusy = true;
        updatePipButton();
        let hostError = null;
        try {
          if (hostDockSupported()) {
            try {
              if (displayMode !== "fullscreen") await requestHostDisplayMode("fullscreen");
              activateDockedWindow();
              return;
            } catch (error) {
              hostError = error;
            }
          }
          if (nativePipSupported()) {
            const video = prepareNativePipMedia(true);
            drawPipCanvas();
            if (!video || !pipReady) throw new Error(pipPreparationError || labels.pipUnavailable);
            pipWindow = await host.withTimeout(video.requestPictureInPicture());
            activateNativePip();
            pipWindow?.addEventListener?.("resize", drawPipCanvas);
            return;
          }
          throw new Error(labels.pipUnavailable);
        } catch (error) {
          const reason = hostError
            ? String(hostError?.message || hostError) + "; " + String(error?.message || error)
            : String(error?.message || error);
          pipPreparationError = reason;
          activateDockedWindow("inline-live");
        } finally {
          presentationBusy = false;
          updatePipButton();
        }
      }

      async function exitPip() {
        if (!isLiveMode() || presentationBusy) return;
        const presentation = livePresentation;
        presentationBusy = true;
        updatePipButton();
        try {
          if (presentation === "docked") {
            if (restoreDisplayMode !== "fullscreen") await requestHostDisplayMode("inline");
            if (isDockMode()) finishLiveWindow(true);
          } else if (presentation === "inline-live") {
            finishLiveWindow(true);
          } else if (
            typeof document.exitPictureInPicture === "function"
            && document.pictureInPictureElement
          ) {
            await host.withTimeout(document.exitPictureInPicture());
          }
          if (isNativePipMode()) finishNativePip(true);
        } catch (error) {
          liveError = String(error?.message || error);
          drawLiveSurface();
          updatePipButton();
        } finally {
          presentationBusy = false;
          updatePipButton();
        }
      }

      function computeDomain() {
        let start = Infinity;
        let end = -Infinity;
        for (const record of data?.records || []) {
          const range = recordRange(record);
          if (!range) continue;
          start = Math.min(start, range.start);
          end = Math.max(end, range.end);
        }
        if (!Number.isFinite(start)) return { start: Date.now(), end: Date.now() + 1 };
        if (end <= start) end = start + 1;
        return { start, end };
      }

      function pageState(snapshot = data) {
        const records = snapshot?.records || [];
        const firstRecord = records.at(0)?.index ?? null;
        const lastRecord = records.at(-1)?.index ?? null;
        const totalRecords = Number.isFinite(snapshot?.stats?.records) ? snapshot.stats.records : records.length;
        const earlierRecords = firstRecord === null ? 0 : Math.max(0, firstRecord - 1);
        const laterRecords = lastRecord === null ? totalRecords : Math.max(0, totalRecords - lastRecord);
        return {
          firstRecord,
          lastRecord,
          earlierRecords,
          laterRecords,
          hasEarlier: earlierRecords > 0,
          hasLater: laterRecords > 0,
          nextBeforeRecord: earlierRecords > 0 ? firstRecord : null,
        };
      }

      function mergeEarlierPage(current, page) {
        if (page?.session?.id !== current.session.id || page.detailLevel !== current.detailLevel) {
          throw new Error(labels.loadError);
        }
        const recordsByIndex = new Map();
        for (const record of [...(page.records || []), ...current.records]) recordsByIndex.set(record.index, record);
        let loadedBytes = 0;
        const records = [];
        for (const record of [...recordsByIndex.values()].sort((left, right) => left.index - right.index)) {
          const bytes = JSON.stringify(record).length * 2;
          if (records.length >= MAX_LOADED_RECORDS || loadedBytes + bytes > MAX_LOADED_BYTES) break;
          records.push(record);
          loadedBytes += bytes;
        }
        const turnsByIndex = new Map();
        for (const turn of [...(page.turns || []), ...(current.turns || [])]) turnsByIndex.set(turn.index, turn);
        const ownedTurns = new Set(records.map(record => record.turn));
        const turns = [...turnsByIndex.values()].filter(turn => ownedTurns.has(turn.index))
          .sort((left, right) => left.index - right.index);
        const warningKeys = new Set();
        const warnings = [...(current.warnings || []), ...(page.warnings || [])].filter(warning => {
          const key = `${warning.code}\u0000${warning.line}\u0000${warning.message}`;
          if (warningKeys.has(key) || warningKeys.size >= 100) return false;
          warningKeys.add(key);
          return true;
        });
        const totalRecords = Number.isFinite(current.stats?.records) ? current.stats.records : records.length;
        const totalTurns = Number.isFinite(current.stats?.turns) ? current.stats.turns : turns.length;
        const stats = {
          ...current.stats,
          visibleRecords: records.length,
          omittedRecords: Math.max(0, totalRecords - records.length),
        };
        if (turns.length < totalTurns) {
          stats.visibleTurns = turns.length;
          stats.omittedTurns = totalTurns - turns.length;
        } else {
          delete stats.visibleTurns;
          delete stats.omittedTurns;
        }
        const merged = { ...current, stats, turns, records, warnings };
        merged.pagination = pageState(merged);
        return merged;
      }

      function render(next, options = {}) {
        if (next?.viewerState === "read-limit-exceeded") {
          showReadLimit(next);
          return;
        }
        if (next?.viewerState === "select-session") {
          showSessionSelection(next.reason);
          return;
        }
        if (!next?.session || !Array.isArray(next.records)) return;
        readLimitPrompt = null;
        if (Array.isArray(next.recentSessions)) {
          recentSessions = normalizeRecentSessions(next.recentSessions);
          recentSessionsRequested = true;
        }
        const previousSessionId = data?.session?.id;
        if (!options.prepend) resetRecordDetails();
        dataRevision = options.revision || null;
        if (previousSessionId !== next.session.id && !options.keepDetailMode) fullDetailsEnabled = next.detailLevel === "full";
        else if (next.detailLevel === "full") fullDetailsEnabled = true;
        const previousLastTurn = data?.records?.at(-1)?.turn;
        const nextLastTurn = next.records.at(-1)?.turn;
        const resetToLatest = previousSessionId !== next.session.id || previousLastTurn !== nextLastTurn || expandedTurns.size === 0;
        const previousSelectedIndex = selectedIndex;
        const previousLedger = document.querySelector(".ledger-wrap");
        const previousScrollTop = previousLedger?.scrollTop || 0;
        const previousScrollHeight = previousLedger?.scrollHeight || 0;
        if (resetToLatest) expandedTurns = new Set(Number.isFinite(nextLastTurn) ? [nextLastTurn] : []);
        data = next;
        if (isLiveMode() && next.session.id === liveSessionId) liveData = safeLiveSnapshot(next);
        prepareNativePipMedia();
        fullConfirmationOpen = false;
        fullDomain = computeDomain();
        viewport = { ...fullDomain };
        selectedRange = null;
        selectedIndex = !resetToLatest && next.records.some(record => record.index === previousSelectedIndex) ? previousSelectedIndex : next.records.at(-1)?.index || null;
        if (isDockMode()) drawDockedShell(); else drawShell();
        if (isNativePipMode()) drawPipCanvas();
        const ledgerWrap = document.querySelector(".ledger-wrap");
        if (ledgerWrap) {
          if (options.prepend) ledgerWrap.scrollTop = previousScrollTop + Math.max(0, ledgerWrap.scrollHeight - previousScrollHeight);
          else ledgerWrap.scrollTop = resetToLatest ? ledgerWrap.scrollHeight : previousScrollTop;
        }
        if (isLiveMode() && !liveBusy && liveTimer === null) startLiveLoop();
        if (!recentSessionsRequested && !isDockMode()) {
          window.requestAnimationFrame(() => void loadRecentSessions());
        }
      }

      function stat(label, value) {
        const formatted = String(value);
        return `<div class="stat"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value ${numberFitClass(formatted)}">${escapeHtml(formatted)}</div></div>`;
      }

      function numberFitClass(formatted) {
        if (formatted.length > 18) return "number-xlong";
        if (formatted.length > 14) return "number-long";
        return "";
      }

      const firstNumber = (...values) => values.find(value => Number.isFinite(value)) ?? 0;

      function usageView(raw = {}) {
        const input = firstNumber(raw.input_tokens, raw.prompt_tokens);
        const cached = firstNumber(raw.cached_input_tokens, raw.input_tokens_details?.cached_tokens, raw.prompt_tokens_details?.cached_tokens);
        const output = firstNumber(raw.output_tokens, raw.completion_tokens);
        const reasoning = firstNumber(raw.reasoning_output_tokens, raw.output_tokens_details?.reasoning_tokens, raw.completion_tokens_details?.reasoning_tokens);
        return {
          total: firstNumber(raw.total_tokens, input + output),
          input,
          cached,
          uncached: Math.max(0, input - cached),
          output,
          reasoning,
          visible: Math.max(0, output - reasoning),
        };
      }

      function hasTokenUsage(raw) {
        return raw && typeof raw === "object" && Object.values(raw).some(value => Number.isFinite(value));
      }

      function percentage(value, total) {
        if (!Number.isFinite(value) || !Number.isFinite(total) || total <= 0) return "—";
        return `${new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(value / total * 100)}%`;
      }

      function hasCostEstimate(cost) {
        return cost && typeof cost === "object" && ["complete", "partial", "unavailable"].includes(cost.coverage);
      }

      function costCoverageLabel(cost) {
        if (cost?.coverage === "complete") return labels.costComplete;
        if (cost?.coverage === "partial") return labels.costPartial;
        return labels.costUnavailable;
      }

      function usd(value) {
        if (!Number.isFinite(value)) return "—";
        const absolute = Math.abs(value);
        const digits = absolute === 0 || absolute >= 1 ? 2 : absolute >= .01 ? 4 : absolute >= .0001 ? 6 : 8;
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: digits,
          maximumFractionDigits: digits,
        }).format(value);
      }

      function loggedFastCosts(snapshot = data) {
        return (snapshot?.warnings || []).some(warning => warning.code === "codex_fast_cost_multiplier");
      }

      function costSnapshot() {
        return isLiveMode() ? liveData || data : data;
      }

      function manualCostMultiplier(snapshot = costSnapshot()) {
        return !loggedFastCosts(snapshot) && taskCostModes.get(snapshot?.session?.id) === "fast" ? 2.5 : 1;
      }

      function costModeNote(snapshot = costSnapshot()) {
        return loggedFastCosts(snapshot) ? labels.costLoggedFastNote
          : manualCostMultiplier(snapshot) === 2.5 ? labels.costFastNote : labels.costAutoNote;
      }

      function fastCostLabel(snapshot = costSnapshot()) {
        return loggedFastCosts(snapshot) ? (zh ? "包含日志 Fast ×2.5" : "Includes logged Fast ×2.5")
          : manualCostMultiplier(snapshot) === 2.5 ? (zh ? "手动 Fast ×2.5" : "Manual Fast ×2.5") : "";
      }

      function costModeControls() {
        const logged = loggedFastCosts(data);
        const manual = !logged && taskCostModes.get(data?.session?.id) === "fast";
        return `<div class="cost-settings"><label for="costMode">${escapeHtml(labels.costMode)}</label>
          <select id="costMode" aria-describedby="costModeNote" ${logged ? "disabled" : ""}>
            <option value="auto" ${manual ? "" : "selected"}>${escapeHtml(labels.costAuto)}</option>
            <option value="fast" ${manual ? "selected" : ""}>${escapeHtml(labels.costFast)}</option>
          </select><span class="section-note" id="costModeNote">${escapeHtml(costModeNote(data))}</span></div>`;
      }

      function costText(cost) {
        if (!hasCostEstimate(cost) || !Number.isFinite(cost.totalUsd)) return "—";
        return `${cost.coverage === "partial" ? "≥" : "≈"}${usd(cost.totalUsd * manualCostMultiplier())}`;
      }

      function costNoteText(cost) {
        const pricingDate = typeof cost?.pricingUpdatedAt === "string" ? cost.pricingUpdatedAt : "—";
        return labels.costNote.replace("{date}", pricingDate) + " " + costModeNote();
      }

      function rateLimitWindowLabel(window, key) {
        const minutes = window.windowMinutes;
        if (minutes === 300) return labels.fiveHourLimit;
        if (minutes === 10_080) return labels.weeklyLimit;
        if (minutes % 1_440 === 0) return `${number(minutes / 1_440)}${zh ? "天" : "d"}`;
        if (minutes % 60 === 0) return `${number(minutes / 60)}${zh ? "小时" : "h"}`;
        if (Number.isFinite(minutes)) return `${number(minutes)}${zh ? "分钟" : "m"}`;
        return key === "primary" ? labels.primaryLimit : labels.secondaryLimit;
      }

      function rateLimitView(raw, sampledAt = null) {
        const items = [];
        for (const key of ["primary", "secondary"]) {
          const window = raw?.[key];
          if (
            !window
            || !Number.isFinite(window.usedPercent)
            || window.usedPercent < 0
            || window.usedPercent > 100
            || !Number.isInteger(window.windowMinutes)
            || window.windowMinutes <= 0
          ) continue;
          const remaining = Math.max(0, 100 - window.usedPercent);
          const remainingText = `${new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(remaining)}%`;
          const label = rateLimitWindowLabel(window, key);
          const resetText = window.resetsAt ? date(window.resetsAt) : "—";
          items.push({
            key,
            label,
            remaining,
            remainingText,
            windowMinutes: window.windowMinutes,
            resetsAt: window.resetsAt || null,
            resetText,
          });
        }
        const aria = items.length
          ? `${labels.codexQuota}: ${items.map(item => `${item.label} ${item.remainingText} ${labels.quotaRemaining}`).join(", ")}`
          : labels.codexQuota;
        const sampleNote = sampledAt ? `${labels.quotaSample}: ${date(sampledAt)}` : "";
        return {
          items,
          title: [aria, sampleNote].filter(Boolean).join(" · "),
          sampleNote,
          signature: items.map(item => `${item.key}:${item.remaining}:${item.resetsAt || ""}`).join("|"),
          aria,
          compact: items.map(item => `${item.label} ${item.remainingText}`).join(" · "),
        };
      }

      function dockQuotaMarkup(quota) {
        return `<span class="dock-quota-label">${escapeHtml(labels.codexQuota)}</span><span class="dock-quota-values">${quota.items.map(item => `
          <span class="dock-quota-window" data-quota-window="${escapeHtml(item.key)}" title="${escapeHtml(item.label + " · " + item.remainingText + " " + labels.quotaRemaining + " · " + labels.quotaResets + " " + item.resetText + (quota.sampleNote ? " · " + quota.sampleNote : ""))}">
            <span>${escapeHtml(item.label)}</span><strong>${escapeHtml(item.remainingText)}</strong>
          </span>`).join("")}</span>`;
      }

      function tokenMetric(key, label, value) {
        const formatted = number(value);
        return `<div class="token-metric" data-token-metric="${escapeHtml(key)}"><div class="token-metric-label">${escapeHtml(label)}</div><div class="token-metric-value ${numberFitClass(formatted)}">${escapeHtml(formatted)}</div></div>`;
      }

      function costMetric(cost) {
        const formatted = costText(cost);
        return `<div class="token-metric" data-token-metric="cost"><div class="token-metric-label">${escapeHtml(labels.estimatedCost)}</div><div class="token-metric-value ${numberFitClass(formatted)}">${escapeHtml(formatted)}</div></div>`;
      }

      function tokenSegment(className, label, value, total) {
        if (!Number.isFinite(value) || value <= 0 || !Number.isFinite(total) || total <= 0) return "";
        const width = Math.max(0, Math.min(100, value / total * 100));
        return `<span class="token-segment ${className}" style="width:${width}%" title="${escapeHtml(label)} · ${escapeHtml(number(value))}"></span>`;
      }

      function tokenLegendItem(className, label, value) {
        return `<span class="token-legend-item"><span class="token-legend-dot ${className}"></span>${escapeHtml(label)} ${escapeHtml(number(value))}</span>`;
      }

      function tokenBreakdown(title, total, segments) {
        return `<div class="token-breakdown"><div class="token-breakdown-head"><span>${escapeHtml(title)}</span><strong>${escapeHtml(number(total))}</strong></div>
          <div class="token-bar">${segments.map(segment => tokenSegment(segment.className, segment.label, segment.value, total)).join("")}</div>
          <div class="token-legend">${segments.map(segment => tokenLegendItem(segment.className, segment.label, segment.value)).join("")}</div></div>`;
      }

      function tokenDetailsPanel(stats, turns) {
        const rawTotal = stats.tokens;
        if (!hasTokenUsage(rawTotal)) {
          return `<section class="token-panel" id="tokenDetails"><div class="section-title">${labels.tokenDetails}</div><div class="section-note">${labels.noTokenData}</div></section>`;
        }
        const total = usageView(rawTotal);
        const cost = hasCostEstimate(stats.cost) ? stats.cost : null;
        const modelRequests = turns.every(turn => Number.isFinite(turn.modelCalls))
          ? turns.reduce((sum, turn) => sum + turn.modelCalls, 0) : undefined;
        const contextBadge = Number.isFinite(stats.contextWindow) ? `<span class="token-badge">${labels.contextWindow} ${number(stats.contextWindow)}</span>` : "";
        const costCoverage = cost ? `<span class="token-badge ${escapeHtml(cost.coverage)}">${labels.costCoverage} ${escapeHtml(costCoverageLabel(cost))}</span>` : "";
        return `<section class="token-panel" id="tokenDetails" aria-labelledby="tokenDetailsTitle">

      function ledgerTooltipAttribute(value, always = false) {
        if (!value) return "";
        return ` data-ledger-tooltip="${escapeHtml(value)}"${always ? ' data-tooltip-always="true"' : ""}`;
      }

      function hideLedgerTooltip() {
        const tooltip = document.getElementById("ledgerTooltip");
        if (ledgerTooltipTarget) ledgerTooltipTarget.removeAttribute("aria-describedby");
        ledgerTooltipTarget = null;
        if (tooltip) tooltip.hidden = true;
      }

      function showLedgerTooltip(target, force = false) {
        const text = target.dataset.ledgerTooltip;
        const tooltip = document.getElementById("ledgerTooltip");
        if (!text || !tooltip) return;
        const truncated = target.scrollWidth > target.clientWidth + 1 || target.scrollHeight > target.clientHeight + 1;
        if (!force && !truncated) { hideLedgerTooltip(); return; }
        hideLedgerTooltip();
        tooltip.textContent = text;
        tooltip.style.visibility = "hidden";
        tooltip.hidden = false;
        const targetRect = target.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const left = Math.max(12, Math.min(targetRect.left, window.innerWidth - tooltipRect.width - 12));
        let top = targetRect.top - tooltipRect.height - 7;
        if (top < 12) top = Math.min(window.innerHeight - tooltipRect.height - 12, targetRect.bottom + 7);
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
        tooltip.style.visibility = "visible";
        target.setAttribute("aria-describedby", "ledgerTooltip");
        ledgerTooltipTarget = target;
      }

      function bindLedgerTooltips() {
        const ledger = document.getElementById("ledger");
        const wrap = ledger?.parentElement;
        if (!ledger || !wrap) return;
        ledger.addEventListener("pointerover", event => {
          const target = event.target.closest(".event-cell[data-ledger-tooltip], .summary[data-ledger-tooltip]");
          if (target && ledger.contains(target)) showLedgerTooltip(target, target.dataset.tooltipAlways === "true");
        });
        ledger.addEventListener("pointerout", event => {
          if (ledgerTooltipTarget && !ledgerTooltipTarget.contains(event.relatedTarget)) hideLedgerTooltip();
        });
        ledger.addEventListener("focusin", event => {
          const row = event.target.closest("tr.record[data-ledger-tooltip]");
          if (row) showLedgerTooltip(row, true);
        });
        ledger.addEventListener("focusout", hideLedgerTooltip);
        ledger.addEventListener("keydown", event => { if (event.key === "Escape") hideLedgerTooltip(); });
        wrap.addEventListener("scroll", hideLedgerTooltip, { passive: true });

      function liveDelay() {
        if (!liveFailures) return LIVE_INTERVAL_MS;
        return Math.min(LIVE_MAX_BACKOFF_MS, LIVE_INTERVAL_MS * (2 ** liveFailures));
      }

      function scheduleLiveRefresh(delay = LIVE_INTERVAL_MS) {
        stopLiveLoop();
        if (!isLiveMode() || document.hidden) return;
        liveTimer = window.setTimeout(() => {
          liveTimer = null;
          void refreshLiveTrajectory();
        }, delay);
      }

      function startLiveLoop() {
        if (!isLiveMode() || liveBusy || liveTimer !== null) return;
        scheduleLiveRefresh(0);
      }

      async function refreshLiveTrajectory() {
        if (!isLiveMode() || liveBusy || document.hidden || !liveSessionId) return;
        liveBusy = true;
        const sessionId = liveSessionId;
        try {
          const liveArgs = { sessionId, includeArchived: true };
          if (liveRevision) liveArgs.revision = liveRevision;
          const result = await callTool("get_codex_trajectory_update", liveArgs);
          if (!isLiveMode() || liveSessionId !== sessionId) return;
          if (result?.structuredContent?.viewerState === "read-limit-exceeded") {
            showReadLimit(result.structuredContent);
            return;
          }
          if (result?.isError) {
            const message = (result.content || []).map(item => item?.text).filter(Boolean).join(" ");
            throw new Error(message || labels.loadError);
          }
          const update = result?.structuredContent;
          if (
            !update
            || update.schemaVersion !== 2
            || typeof update.unchanged !== "boolean"
            || !/^[0-9a-f]{64}$/.test(update.revision || "")
          ) throw new Error(labels.loadError);
          if (!update.unchanged) {
            const trajectory = update.trajectory;
            if (
              trajectory?.session?.id !== sessionId
              || trajectory.detailLevel !== "summary"
              || !Array.isArray(trajectory.records)
            ) throw new Error(labels.loadError);
            const previousLatestId = String(liveData?.records?.at(-1)?.id || "");
            const nextLiveData = safeLiveSnapshot(trajectory);
            const nextLatestId = String(nextLiveData.records?.at(-1)?.id || "");
            if (isDockMode() && nextLatestId && nextLatestId !== previousLatestId) {
              liveMiningRecordId = nextLatestId;
            }
            liveData = nextLiveData;
          }
          if (liveData && update.quota && Object.hasOwn(update.quota, "rateLimits")) {
            liveData.stats.rateLimits = update.quota.rateLimits;
            liveData.stats.quotaSampledAt = update.quota.sampledAt || null;
          }
          liveRevision = update.revision;
          liveCheckedAt = new Date().toISOString();
          liveFailures = 0;
          liveError = null;
        } catch (error) {
          if (isLiveMode() && liveSessionId === sessionId) {
            liveFailures = Math.min(liveFailures + 1, 8);
            liveError = String(error?.message || error);
          }
        } finally {
          liveBusy = false;
          if (isLiveMode()) {
            drawLiveSurface();
            scheduleLiveRefresh(liveDelay());
          }
        }
      }

            </div>

              <div class="section-head"><div><span class="section-title">${labels.overview}</span> <span class="section-note">${labels.hint}</span></div><button id="resetView" type="button">${labels.reset}</button></div>
              <div class="timeline-wrap"><div id="timeline" role="group" tabindex="0" aria-label="${labels.overview} · +/- zoom, arrows pan, Escape reset"><div id="selection"></div></div><div class="ticks"><span id="tickStart"></span><span id="tickMiddle"></span><span id="tickEnd"></span></div></div>
            </section>
            <div class="toolbar">
              <input id="search" type="search" aria-label="${labels.search}" placeholder="${labels.search}" value="${escapeHtml(search)}">
              <select id="kindFilter" aria-label="${labels.all}"><option value="all">${labels.all}</option>${["user","assistant","reasoning","tool","subagent","compaction"].map(value => `<option value="${value}">${value === "reasoning" ? labels.reasoningEvent : value}</option>`).join("")}</select>

            ${(data.warnings || []).length ? `<div class="notice" role="status"><strong>${labels.warnings}:</strong> ${escapeHtml(data.warnings.map(item => item.message).join(" "))}</div>` : ""}
            <div class="content"><div class="ledger-wrap"><table id="ledger" aria-label="${labels.records}"><colgroup><col><col><col><col><col></colgroup></table></div><aside class="inspector" id="inspector" aria-label="${escapeHtml(labels.recordDetails)}" tabindex="-1"></aside></div>

        populateSessions();

        drawLedger();

      function populateSessions() {
        const select = document.getElementById("sessionSelect");
        if (!select) return;
        select.innerHTML = recentSessions.map(session => `<option value="${escapeHtml(session.id)}" ${session.id === data?.session?.id ? "selected" : ""}>${escapeHtml(session.title)} · ${escapeHtml(session.id.slice(0, 8))}</option>`).join("");
        if (!data?.session) {
          select.insertAdjacentHTML("afterbegin", `<option value="" selected disabled>${recentSessionsRequested && !recentSessions.length ? labels.noSessions : labels.selectTask}</option>`);
        } else if (!recentSessions.some(session => session.id === data.session.id)) {
          select.insertAdjacentHTML("afterbegin", `<option value="${escapeHtml(data.session.id)}" selected>${escapeHtml(data.session.title)}</option>`);
        }
        select.disabled = busy || recentSessionsBusy;
      }

      function normalizeRecentSessions(value) {
        if (!Array.isArray(value)) return [];
        return value.filter(session => (
          isPlainObject(session)
          && typeof session.id === "string"
          && session.id.length > 0
          && session.id.length <= 240
          && typeof session.title === "string"
          && session.title.length <= 100
        )).slice(0, 20);
      }

      async function loadRecentSessions() {
        if (recentSessionsRequested || recentSessionsBusy) return;
        recentSessionsBusy = true;
        populateSessions();
        try {
          const result = await callTool("list_codex_sessions", {
            limit: 20,
            includeArchived: !data?.session,
          });
          if (result?.isError || !Array.isArray(result?.structuredContent?.sessions)) throw new Error(labels.loadError);
          recentSessions = normalizeRecentSessions(result.structuredContent.sessions);
          recentSessionsRequested = true;
        } catch (error) {
          showLoadError(error);
        } finally {
          recentSessionsBusy = false;
          populateSessions();
        }
      }

      function bindControls() {
        document.getElementById("costMode")?.addEventListener("change", event => {
          taskCostModes.set(data.session.id, event.target.value === "fast" ? "fast" : "auto");
          const turnsOpen = document.querySelector("details.token-turns")?.open;
          const ledgerScrollTop = document.querySelector(".ledger-wrap")?.scrollTop || 0;
          drawShell();
          if (turnsOpen) {
            document.querySelector("details.token-turns").open = true;
            drawTokenTurnRows();
          }
          document.querySelector(".ledger-wrap").scrollTop = ledgerScrollTop;
          document.getElementById("costMode")?.focus({ preventScroll: true });
        });
        document.getElementById("search").addEventListener("input", event => { search = event.target.value; drawLedger(); });
        document.getElementById("kindFilter").addEventListener("change", event => { kind = event.target.value; drawLedger(); });
        document.getElementById("refresh").addEventListener("click", () => loadSession(data.session.id, fullDetailsEnabled ? "full" : "summary"));
        document.getElementById("openPip")?.addEventListener("click", enterPip);
        document.getElementById("sessionSelect").addEventListener("change", event => loadSession(event.target.value));
        document.getElementById("sessionSelect").addEventListener("focus", () => void loadRecentSessions());
        document.getElementById("loadEarlier")?.addEventListener("click", loadEarlierRecords);
        document.querySelector("details.token-turns")?.addEventListener("toggle", event => {
          if (event.currentTarget.open) drawTokenTurnRows();
        });
        document.getElementById("loadFull")?.addEventListener("click", () => {
          if (busy) return;
          fullConfirmationOpen = true;
          rememberFullChoice = true;
          drawShell();
          document.getElementById("confirmFull")?.focus();
        });
        document.getElementById("cancelFull")?.addEventListener("click", () => {
          fullConfirmationOpen = false;
          drawShell();
          document.getElementById("loadFull")?.focus();
        });
        document.getElementById("rememberFull")?.addEventListener("change", event => { rememberFullChoice = event.target.checked; });
        document.getElementById("confirmFull")?.addEventListener("click", enableRecordDetails);
        document.getElementById("useSummary")?.addEventListener("click", () => loadSession(data.session.id, "summary", { forget: true }));
        document.getElementById("resetView").addEventListener("click", () => { viewport = { ...fullDomain }; selectedRange = null; drawTimeline(); drawLedger(); });
        const timeline = document.getElementById("timeline");
        timeline.addEventListener("keydown", event => {
          if (!["+", "=", "-", "ArrowLeft", "ArrowRight", "Escape"].includes(event.key)) return;
          event.preventDefault();
          const width = viewport.end - viewport.start;
          const totalWidth = fullDomain.end - fullDomain.start;
          if (event.key === "Escape") { viewport = { ...fullDomain }; selectedRange = null; }
          else if (event.key.startsWith("Arrow")) {
            const shift = width * (event.key === "ArrowLeft" ? -.15 : .15);
            const start = Math.max(fullDomain.start, Math.min(fullDomain.end - width, viewport.start + shift));
            viewport = { start, end: start + width };
          } else {
            const nextWidth = Math.max(1, Math.min(totalWidth, width * (event.key === "-" ? 1.4 : .7)));
            const start = Math.max(fullDomain.start, Math.min(fullDomain.end - nextWidth, viewport.start + (width - nextWidth) / 2));
            viewport = { start, end: start + nextWidth };
          }
          drawTimeline(); drawLedger();
        });
        timeline.addEventListener("pointerdown", timelinePointerDown);
        timeline.addEventListener("pointermove", timelinePointerMove);
        timeline.addEventListener("pointerup", timelinePointerUp);
        timeline.addEventListener("pointercancel", timelinePointerUp);
        timeline.addEventListener("wheel", timelineWheel, { passive: false });
        timeline.addEventListener("contextmenu", event => { event.preventDefault(); selectedRange = null; drawTimeline(); drawLedger(); });
      }

      function updateBusyControls() {
        for (const id of ["refresh", "loadFull", "cancelFull", "confirmFull", "rememberFull", "useSummary", "loadEarlier"]) {
          const control = document.getElementById(id);
          if (control) control.disabled = busy;
        }
        updatePipButton();
      }

      async function loadSession(sessionId, detailLevel = null, options = {}) {
        if (busy) return;
        busy = true;
        const sessionSelect = document.getElementById("sessionSelect");
        if (sessionSelect) sessionSelect.disabled = true;
        updateBusyControls();
        try {
          app.setAttribute("aria-busy", "true");
          await loadViewerPreferences(detailLevel === null);
          if (options.remember) await saveViewerDefault(true);
          if (options.forget && !await saveViewerDefault(false)) {
            drawShell();
            return;
          }
          const enableDetails = detailLevel === "full" || (detailLevel === null && defaultFullDetails);
          const result = await callTool("get_codex_trajectory", { sessionId, maxRecords: REFRESH_MAX_RECORDS, includeArchived: true, detailLevel: "summary" });
          if (result?.structuredContent?.viewerState === "read-limit-exceeded") {
            if (options.exactIdentity && result.structuredContent.sessionId !== sessionId) {
              showSessionSelection("task-unavailable", false);
              return;
            }
            showReadLimit(result.structuredContent);
            return;
          }
          if (result?.isError) {
            const message = (result.content || []).map(item => item?.text).filter(Boolean).join(" ");
            throw new Error(message || labels.loadError);
          }
          if (!result?.structuredContent) throw new Error(labels.loadError);
          if (options.exactIdentity && result.structuredContent.session?.id !== sessionId) {
            showSessionSelection("task-unavailable", false);
            return;
          }
          fullDetailsEnabled = enableDetails;
          render(result.structuredContent, { keepDetailMode: true, revision: resultRevision(result) });
        } catch (error) {
          showLoadError(error);
        } finally {
          busy = false;
          updateBusyControls();
          document.getElementById("readLimitGb")?.removeAttribute("disabled");
          const limitButton = document.getElementById("enableReadLimit");
          if (limitButton) { limitButton.disabled = false; limitButton.textContent = labels.enableReadLimit; }
          populateSessions();
          app.setAttribute("aria-busy", "false");
        }
      }

      async function loadEarlierRecords() {
        if (busy) return;
        const cursor = pageState(data).nextBeforeRecord;
        if (!Number.isFinite(cursor) || cursor <= 1) return;
        busy = true;
        updateBusyControls();
        const button = document.getElementById("loadEarlier");
        if (button) {
          button.disabled = true;
          button.textContent = labels.loadingEarlier;
        }
        document.getElementById("refresh")?.setAttribute("disabled", "");
        document.getElementById("sessionSelect")?.setAttribute("disabled", "");
        try {
          app.setAttribute("aria-busy", "true");
          const result = await callTool("get_codex_trajectory", {
            sessionId: data.session.id,
            maxRecords: REFRESH_MAX_RECORDS,
            beforeRecord: cursor,
            includeArchived: true,
            detailLevel: data.detailLevel,
          });
          if (result?.structuredContent?.viewerState === "read-limit-exceeded") {
            showReadLimit(result.structuredContent);
            return;
          }
          if (result?.isError) {
            const message = (result.content || []).map(item => item?.text).filter(Boolean).join(" ");
            throw new Error(message || labels.loadError);
          }
          const page = result?.structuredContent;
          const pageRevision = resultRevision(result);
          if ((dataRevision || pageRevision) && pageRevision !== dataRevision) throw new Error(changedDetailsMessage());
          const indexes = Array.isArray(page?.records) ? page.records.map(record => record.index) : [];
          const invalidIndexes = indexes.some((index, position) => (
            !Number.isFinite(index)
            || index < 1
            || index >= cursor
            || (position > 0 && index <= indexes[position - 1])
          ));
          if (!page || !indexes.length || invalidIndexes || indexes.at(-1) !== cursor - 1) {
            throw new Error(labels.loadError);
          }
          const merged = mergeEarlierPage(data, page);
          if (merged.records[0]?.index >= data.records[0]?.index) throw new Error(labels.loadError);
          render(merged, { prepend: true, revision: pageRevision });
        } catch (error) {
          showLoadError(error);
        } finally {
          busy = false;
          updateBusyControls();
          document.getElementById("refresh")?.removeAttribute("disabled");
          document.getElementById("sessionSelect")?.removeAttribute("disabled");
          const currentButton = document.getElementById("loadEarlier");
          if (currentButton) {
            currentButton.disabled = false;
            currentButton.textContent = labels.loadEarlier;
          }
          app.setAttribute("aria-busy", "false");
        }
      }

      function showLoadError(error) {
        if (!data && !app.querySelector('[data-viewer-state="select-session"]')) showSessionSelection("missing-context", false);
        const message = String(error?.message || error);
        app.querySelectorAll(":scope > .notice.error").forEach(notice => notice.remove());
        app.insertAdjacentHTML("afterbegin", `<div class="notice error" role="alert"><strong>${labels.loadError}:</strong> ${escapeHtml(message)}</div>`);
      }

      function lane(kind) {
        if (kind === "tool" || kind === "subagent") return 2;
        if (kind === "assistant" || kind === "reasoning") return 1;
        return 0;
      }

      function timeToX(time) {
        return ((time - viewport.start) / Math.max(1, viewport.end - viewport.start)) * 100;
      }

      function xToTime(clientX) {
        const rect = document.getElementById("timeline").getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        return viewport.start + ratio * (viewport.end - viewport.start);
      }

      function drawTimeline() {
        const timeline = document.getElementById("timeline");
        if (!timeline) return;
        timeline.querySelectorAll(".span,.turn-boundary").forEach(node => node.remove());
        for (const turn of data.turns || []) {
          const start = Date.parse(turn.startedAt || "");
          if (!Number.isFinite(start) || start < viewport.start || start > viewport.end) continue;
          const boundary = document.createElement("div");
          boundary.className = "turn-boundary";
          boundary.style.left = `${timeToX(start)}%`;
          boundary.title = `${labels.turn} ${turn.index}`;
          timeline.appendChild(boundary);
        }
        for (const record of data.records) {
          const range = recordRange(record);
          if (!range || range.end < viewport.start || range.start > viewport.end) continue;
          const start = Math.max(range.start, viewport.start);
          const end = Math.min(range.end, viewport.end);
          const span = document.createElement("button");
          span.type = "button";
          span.className = `span ${record.status === "error" ? "error" : ""} ${record.index === selectedIndex ? "selected" : ""}`;
          span.dataset.kind = record.kind;
          span.style.left = `${Math.max(0, timeToX(start))}%`;
          span.style.width = `${Math.max(.35, timeToX(end) - timeToX(start))}%`;
          span.style.top = `${8 + lane(record.kind) * 27}px`;
          span.title = `#${record.index} ${recordEventTooltip(record)} · ${duration(record.durationMs)}`;
          span.addEventListener("click", event => { event.stopPropagation(); selectRecord(record.index); });
          timeline.appendChild(span);
        }
        const selection = document.getElementById("selection");
        if (selectedRange) {
          selection.style.display = "block";
          selection.style.left = `${timeToX(selectedRange.start)}%`;
          selection.style.width = `${Math.max(.2, timeToX(selectedRange.end) - timeToX(selectedRange.start))}%`;
        } else selection.style.display = "none";
        document.getElementById("tickStart").textContent = date(viewport.start);
        const middleDuration = duration((viewport.end - viewport.start) / 2);
        const endDuration = duration(viewport.end - viewport.start);
        document.getElementById("tickMiddle").textContent = middleDuration === "-" ? "-" : `+${middleDuration}`;
        document.getElementById("tickEnd").textContent = endDuration === "-" ? "-" : `+${endDuration}`;
        const chip = document.getElementById("rangeChip");
        chip.className = selectedRange ? "range-chip" : "";
        chip.textContent = selectedRange ? `${labels.range}: ${duration(selectedRange.end - selectedRange.start)}` : "";
      }

      function timelinePointerDown(event) {
        if (event.target.classList.contains("span")) return;
        event.currentTarget.setPointerCapture(event.pointerId);
        if (event.button === 2) {
          drag = { mode: "pan", x: event.clientX, viewport: { ...viewport } };
        } else if (event.button === 0) {
          const at = xToTime(event.clientX);
          drag = { mode: "select", start: at, current: at };
          selectedRange = { start: at, end: at };
          drawTimeline();
        }
      }

      function timelinePointerMove(event) {
        if (!drag) return;
        if (drag.mode === "select") {
          drag.current = xToTime(event.clientX);
          selectedRange = { start: Math.min(drag.start, drag.current), end: Math.max(drag.start, drag.current) };
          drawTimeline();
          return;
        }
        const rect = event.currentTarget.getBoundingClientRect();
        const delta = ((event.clientX - drag.x) / rect.width) * (drag.viewport.end - drag.viewport.start);
        const width = drag.viewport.end - drag.viewport.start;
        let start = drag.viewport.start - delta;
        start = Math.max(fullDomain.start, Math.min(fullDomain.end - width, start));
        viewport = { start, end: start + width };
        drawTimeline();
      }

      function timelinePointerUp() {
        if (drag?.mode === "select" && selectedRange && selectedRange.end - selectedRange.start < 2) selectedRange = null;
        drag = null;
        drawTimeline();
        drawLedger();
      }

      function timelineWheel(event) {
        event.preventDefault();
        const anchor = xToTime(event.clientX);
        const currentWidth = viewport.end - viewport.start;
        const fullWidth = fullDomain.end - fullDomain.start;
        const minimumWidth = Math.min(10, fullWidth);
        const nextWidth = Math.max(minimumWidth, Math.min(fullWidth, currentWidth * Math.exp(event.deltaY * .0015)));
        const ratio = (anchor - viewport.start) / currentWidth;
        let start = anchor - nextWidth * ratio;
        start = Math.max(fullDomain.start, Math.min(fullDomain.end - nextWidth, start));
        viewport = { start, end: start + nextWidth };
        drawTimeline();
      }

      function visibleRecords() {
        const needle = search.trim().toLowerCase();
        return data.records.filter(record => {
          if (kind !== "all" && record.kind !== kind) return false;
          if (selectedRange) {
            const range = recordRange(record);
            if (!range || range.end < selectedRange.start || range.start > selectedRange.end) return false;
          }
          if (!needle) return true;
          const detailed = fullDetailsEnabled ? recordDetails.get(record.index)?.record || record : record;
          return [record.event, record.summary, detailed.summary, recordEventLabel(record), recordContent(record), detailed.input, detailed.output, record.callId].some(value => String(value || "").toLowerCase().includes(needle));
        });
      }

      function drawLedger() {
        const ledger = document.getElementById("ledger");
        if (!ledger) return;
        hideLedgerTooltip();
        const records = visibleRecords();
        const filtering = Boolean(search.trim() || kind !== "all" || selectedRange);
        const groups = [];
        for (const record of records) {
          let group = groups.at(-1);
          if (!group || group.turn !== record.turn) {
            group = { turn: record.turn, records: [] };
            groups.push(group);
          }
          group.records.push(record);
        }
        const previousScrollTop = ledger.parentElement?.scrollTop || 0;
        ledger.querySelectorAll("tbody").forEach(group => group.remove());
        for (const group of groups) {
          const turn = (data.turns || []).find(item => item.index === group.turn) || {};
          const expanded = filtering || expandedTurns.has(group.turn);
          const turnGroup = document.createElement("tbody");
          turnGroup.className = "turn-group";
          turnGroup.dataset.turn = group.turn;
          const header = document.createElement("tr");
          header.className = `turn-row ${expanded ? "expanded" : "collapsed"}`;
          header.dataset.turn = group.turn;
          const recordCount = Number.isFinite(turn.records) ? turn.records : group.records.length;
          const toggleLabel = expanded ? labels.collapseTurn : labels.expandTurn;
          const model = turn.model || data.session.model;
          const modelSummary = model ? ` · <span class="turn-model">${labels.modelLabel} ${escapeHtml(model)}</span>` : "";
          const turnCostSummary = hasCostEstimate(turn.cost) ? `<span class="turn-cost">· ${escapeHtml(labels.estimatedCost)} ${escapeHtml(costText(turn.cost))}</span>` : "";
          const turnUsage = hasTokenUsage(turn.usage) ? usageView(turn.usage) : null;
          const turnToken = (kind, label, value) => {
            return `<span class="turn-token" data-turn-token-kind="${kind}"><span class="turn-token-label">${label}</span><span class="turn-token-value">${number(value)}</span></span>`;
          };
          header.innerHTML = `<td class="turn-summary-cell" colspan="5"><button type="button" class="turn-toggle" data-turn="${group.turn}" aria-expanded="${expanded}" title="${escapeHtml(toggleLabel)}"><span class="turn-caret" aria-hidden="true">${expanded ? "▾" : "▸"}</span><span class="turn-copy"><span class="turn-title">${labels.turn} ${group.turn}${turnCostSummary}</span><span class="turn-meta">${escapeHtml(turn.status || "")} · ${number(recordCount)} ${labels.records} · ${duration(turn.durationMs)}${Number.isFinite(turn.timeToFirstTokenMs) ? ` · TTFT ${duration(turn.timeToFirstTokenMs)}` : ""}${modelSummary}</span></span><span class="turn-token-group">${turnToken("uncached", labels.uncachedInput, turnUsage?.uncached)}${turnToken("cached", labels.cachedInput, turnUsage?.cached)}${turnToken("output", labels.outputTokens, turnUsage?.output)}</span></button></td>`;
          turnGroup.appendChild(header);
          ledger.appendChild(turnGroup);
          if (!expanded) continue;
          const columnHeader = document.createElement("tr");
          columnHeader.className = "turn-column-row";
          const columnHeading = label => `<th scope="col" title="${escapeHtml(label === labels.time ? labels.timingNote : label)}">${escapeHtml(label)}</th>`;
          columnHeader.innerHTML = [labels.index, labels.step, labels.event, labels.summary, labels.time].map(columnHeading).join("");
          turnGroup.appendChild(columnHeader);
          for (const record of group.records) {
            const row = document.createElement("tr");
            row.className = `record ${record.index === selectedIndex ? "selected" : ""}`;
            row.dataset.id = record.id;
            row.dataset.index = record.index;
            row.dataset.ledgerTooltip = `${labels.event}: ${recordEventTooltip(record)}\n${labels.summary}: ${recordContentTooltip(record, data.records, true)}`;
            row.tabIndex = 0;
            const commandState = isCommandRecord(record) ? `<span class="command-state ${record.status === "error" ? "status-error" : ""}">${escapeHtml(recordStatusLabel(record))}</span>` : "";
            row.innerHTML = `<td class="index" data-label="${escapeHtml(labels.index)}">#${record.index}</td><td class="mono" data-label="${escapeHtml(labels.step)}">${record.step ? `S${record.step}` : "—"}</td><td class="event-cell"${ledgerTooltipAttribute(recordEventTooltip(record), true)}><div class="event"><span class="dot ${escapeHtml(record.kind)}"></span><span class="event-name ${record.status === "error" ? "status-error" : record.status === "running" ? "status-running" : ""}">${escapeHtml(recordEventLabel(record))}</span>${commandState}</div></td><td class="summary${record.kind === "reasoning" ? " reasoning-content" : ""}"${ledgerTooltipAttribute(recordContentTooltip(record, data.records, true), true)}>${recordContentMarkup(record, data.records, true)}</td><td class="duration" data-label="${escapeHtml(labels.time)}" title="${escapeHtml(labels.timingNote)}">${escapeHtml(duration(record.durationMs))}</td>`;
            row.addEventListener("click", () => selectRecord(record.index));
            row.addEventListener("keydown", event => {
              if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectRecord(record.index); }
            });
            turnGroup.appendChild(row);
          }
        }
        if (!records.length) {
          const emptyGroup = document.createElement("tbody");
          const row = document.createElement("tr");
          row.innerHTML = `<td colspan="5"><div class="empty">${labels.noMatch}</div></td>`;
          emptyGroup.appendChild(row);
          ledger.appendChild(emptyGroup);
        }
        ledger.querySelectorAll(".turn-row").forEach(row => row.addEventListener("click", () => {
          const turn = Number(row.dataset.turn);
          if (!Number.isFinite(turn)) return;
          if (expandedTurns.has(turn)) expandedTurns.delete(turn); else expandedTurns.add(turn);
          drawLedger();
        }));
        if (ledger.parentElement) ledger.parentElement.scrollTop = previousScrollTop;
        drawInspector();
      }

      function selectRecord(index) {
        const record = data.records.find(item => item.index === index);
        if (record) expandedTurns.add(record.turn);
        selectedIndex = index;
        drawTimeline();
        drawLedger();
        if (fullDetailsEnabled) void loadRecordDetails(index);
        if (window.matchMedia("(max-width: 1100px)").matches) {
          const inspector = document.getElementById("inspector");
          inspector?.scrollIntoView({ block: "start" });
          inspector?.focus({ preventScroll: true });
        } else {
          document.querySelector(`tr[data-index="${index}"]`)?.scrollIntoView({ block: "nearest" });
        }
      }

      function detailSection(title, value, open = false) {
        if (!value) return "";
        return `<details ${open ? "open" : ""}><summary>${escapeHtml(title)}</summary><pre>${escapeHtml(value)}</pre></details>`;
      }

      function resetRecordDetails() {
        detailGeneration += 1;
        recordDetails.clear();
        detailRequests.clear();
        detailErrors.clear();
        detailCacheBytes = 0;
      }

      async function enableRecordDetails() {
        if (busy) return;
        busy = true;
        updateBusyControls();
        const sessionId = data.session.id;
        try {
          if (rememberFullChoice) await saveViewerDefault(true);
          if (data?.session.id !== sessionId) return;
          fullDetailsEnabled = true;
          fullConfirmationOpen = false;
          drawShell();
          // Confirmation is an explicit request for the currently inspected record.
          if (selectedIndex !== null) void loadRecordDetails(selectedIndex);
        } finally {
          busy = false;
          updateBusyControls();
          populateSessions();
        }
      }

      async function loadRecordDetails(index) {
        if (!fullDetailsEnabled || !data || data.detailLevel === "full" || recordDetails.has(index)) return;
        const selected = data.records.find(record => record.index === index);
        if (!selected) return;
        const generation = detailGeneration;
        const sessionId = data.session.id;
        const revision = dataRevision;
        const current = () => generation === detailGeneration && fullDetailsEnabled && data?.session.id === sessionId;
        // Share a pending page read when another clicked record falls in its window.
        const pending = [...detailRequests].find(([cursor]) => index < cursor && index >= cursor - DETAIL_PAGE_RECORDS);
        if (pending) {
          await pending[1];
          if (current() && !recordDetails.has(index) && !detailErrors.has(index)) void loadRecordDetails(index);
          return;
        }
        const cursor = index + 1;
        detailErrors.delete(index);
        const request = (async () => {
          try {
            const result = await callTool("get_codex_trajectory", {
              sessionId, detailLevel: "full", maxRecords: DETAIL_PAGE_RECORDS,
              beforeRecord: cursor, includeArchived: true,
            });
            if (!current()) return;
            if (result?.structuredContent?.viewerState === "read-limit-exceeded") {
              showReadLimit(result.structuredContent);
              throw new Error(labels.loadError);
            }
            if (result?.isError) {
              throw new Error((result.content || []).map(item => item?.text).filter(Boolean).join(" ") || labels.loadError);
            }
            const page = result?.structuredContent;
            const pageRevision = resultRevision(result);
            if ((revision || pageRevision) && pageRevision !== revision) throw new Error(changedDetailsMessage());
            const matches = (record, summary) => record.index === summary.index
              && (revision && pageRevision === revision || record.id === summary.id);
            const target = page?.records?.find(record => matches(record, selected));
            if (page?.session?.id !== sessionId || page.detailLevel !== "full" || !target) {
              throw new Error((result?.content || []).map(item => item?.text).filter(Boolean).join(" ") || labels.loadError);
            }
            for (const record of page.records) {
              const summary = data.records.find(item => item.index === record.index);
              if (!summary || !matches(record, summary)) continue;
              const bytes = JSON.stringify(record).length * 2;
              const old = recordDetails.get(record.index);
              if (old) detailCacheBytes -= old.bytes;
              recordDetails.delete(record.index);
              recordDetails.set(record.index, { record, bytes });
              detailCacheBytes += bytes;
              detailErrors.delete(record.index);
              while (recordDetails.size > 1 && detailCacheBytes > MAX_DETAIL_CACHE_BYTES) {
                const key = recordDetails.keys().next().value;
                detailCacheBytes -= recordDetails.get(key).bytes;
                recordDetails.delete(key);
              }
            }
          } catch (error) {
            if (current()) detailErrors.set(index, String(error?.message || error));
          } finally {
            if (current()) {
              detailRequests.delete(cursor);
              drawLedger();
            }
          }
        })();
        detailRequests.set(cursor, request);
        drawInspector();
        await request;
      }

      function drawInspector() {
        const inspector = document.getElementById("inspector");
        if (!inspector) return;
        const summaryRecord = data.records.find(item => item.index === selectedIndex);
        const record = fullDetailsEnabled ? recordDetails.get(selectedIndex)?.record || summaryRecord : summaryRecord;
        if (!record) { inspector.innerHTML = `<div class="empty">${labels.inspect}</div>`; return; }
        const metadata = record.metadata && Object.keys(record.metadata).length ? JSON.stringify(record.metadata, null, 2) : "";
        const command = isCommandRecord(record) ? commandActivity(record) : null;
        inspector.innerHTML = `<div class="inspect-heading"><h2>#${record.index} ${escapeHtml(recordEventLabel(record))}</h2><button id="backToRecords" type="button">${escapeHtml(labels.backToRecords)}</button></div><div class="inspect-meta">T${record.turn}${record.step ? ` / S${record.step}` : ""} · <span class="${record.status === "error" ? "status-error" : record.status === "running" ? "status-running" : ""}">${escapeHtml(recordStatusLabel(record))}</span></div>
          <div class="inspect-grid">
            <div class="inspect-item" title="${escapeHtml(labels.timingNote)}"><span>${labels.time}</span><strong>${escapeHtml(duration(record.durationMs))}</strong></div>
            <div class="inspect-item"><span>${labels.callId}</span><strong title="${escapeHtml(record.callId || "")}">${escapeHtml(record.callId || "—")}</strong></div>
            <div class="inspect-item"><span>${labels.started}</span><strong>${escapeHtml(date(record.startedAt))}</strong></div>
            <div class="inspect-item"><span>${labels.completed}</span><strong>${escapeHtml(date(record.completedAt))}</strong></div>
            ${command && command.exitCode !== null ? `<div class="inspect-item command-exit"><span>${escapeHtml(labels.commandExitCode)}</span><strong>${command.exitCode}</strong></div>` : ""}
          </div>
          ${record.kind === "reasoning" ? reasoningInspector(record) : command ? commandInspector(record) : `<div>${escapeHtml(record.summary)}</div>`}
          ${record.error ? detailSection(labels.status, record.error, true) : ""}
          ${detailSection(labels.input, record.input, true)}${record.kind === "reasoning" ? "" : detailSection(labels.output, record.output, true)}${detailSection(labels.metadata, metadata)}
          ${fullDetailsEnabled && data.detailLevel !== "full" && !recordDetails.has(selectedIndex) ? `<div class="detail-load-state" role="status">${escapeHtml(detailErrors.get(selectedIndex) || ([...detailRequests.keys()].some(cursor => selectedIndex < cursor && selectedIndex >= cursor - DETAIL_PAGE_RECORDS) ? labels.loading : labels.detailsOnDemand))}</div><button id="loadRecordDetails" type="button">${escapeHtml(detailErrors.has(selectedIndex) ? labels.retryDetails : labels.loadRecordDetails)}</button>` : ""}`;
        document.getElementById("loadRecordDetails")?.addEventListener("click", () => void loadRecordDetails(selectedIndex));
        document.getElementById("backToRecords")?.addEventListener("click", () => {
          const row = document.querySelector(`tr[data-index="${selectedIndex}"]`);
          row?.scrollIntoView({ block: "center" });
          row?.focus({ preventScroll: true });
        });
        inspector.querySelectorAll("[data-reasoning-context-index]").forEach(button => button.addEventListener("click", () => selectRecord(Number(button.dataset.reasoningContextIndex))));
      }

      document.addEventListener("visibilitychange", () => {
        if (!isLiveMode()) return;
        stopLiveLoop();
        drawLiveSurface();
        if (!document.hidden) startLiveLoop();
      });

      const host = window.createTrajectoryHost({
        onResult: result => void receiveHostResult(result),
        onContext: applyHostContext,
        onError: showLoadError,
        onTeardown: () => {
          resetRecordDetails();
          stopLiveLoop();
          livePresentation = "none";
          pipStream?.getTracks().forEach(track => track.stop());
        },
      });
      void host.start();
    })();
  </script>
</body>
</html>
