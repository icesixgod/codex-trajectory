<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex Trajectory</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --panel: #ffffff;
      --panel-2: rgb(242, 242, 242);

      --user: #006acc;
      --assistant: #7847c7;
      --reasoning: #7847c7;
      --tool: #b65d00;
      --subagent: #16833b;
      --compaction: rgba(0, 0, 0, .55);
      --token-new: #006acc;
      --token-cached: #16833b;
      --token-visible: #7847c7;
      --token-reasoning: #7847c7;
      --shadow: 0 8px 28px rgba(0, 0, 0, .07);

    :root[data-codex-theme="dark"] {

      --bg: #141414;
      --panel: #181818;
      --panel-2: rgb(40, 40, 40);

      --line-strong: rgba(255, 255, 255, .156);
      --text: #dfdfdf;
      --muted: rgba(255, 255, 255, .498);
      --accent: rgb(131, 195, 255);
      --accent-soft: #0d273f;
      --danger: #ff6764;
      --success: #40c977;
      --user: #339cff;
      --assistant: #ad7bf9;
      --reasoning: #ad7bf9;
      --tool: #ff8549;
      --subagent: #40c977;
      --compaction: rgba(255, 255, 255, .498);
      --token-new: #339cff;
      --token-cached: #40c977;
      --token-visible: #ad7bf9;
      --token-reasoning: #ad7bf9;
      --shadow: 0 10px 30px rgba(0, 0, 0, .24);

    @media (prefers-color-scheme: dark) {
      :root:not([data-codex-theme]) {

        --bg: #141414;
        --panel: #181818;
        --panel-2: rgb(40, 40, 40);
        --line: rgba(255, 255, 255, .084);
        --line-strong: rgba(255, 255, 255, .156);
        --text: #dfdfdf;
        --muted: rgba(255, 255, 255, .498);
        --accent: rgb(131, 195, 255);
        --accent-soft: #0d273f;
        --danger: #ff6764;
        --success: #40c977;
        --user: #339cff;
        --assistant: #ad7bf9;
        --reasoning: #ad7bf9;
        --tool: #ff8549;
        --subagent: #40c977;
        --compaction: rgba(255, 255, 255, .498);
        --token-new: #339cff;
        --token-cached: #40c977;
        --token-visible: #ad7bf9;

    }
    * { box-sizing: border-box; }
    body {

    }
    button, input, select { font: inherit; color: inherit; }

      overflow: hidden;

    .privacy-copy { min-width: 0; color: var(--muted); }

    .stat { min-width: 0; padding: 12px; border-radius: 9px; background: color-mix(in srgb, var(--panel) 82%, transparent); }

    .token-segment { min-width: 2px; height: 100%; }
    .token-new { background: var(--token-new); }

    .token-visible { background: var(--token-visible); }
    .token-reasoning { background: var(--token-reasoning); }

    .token-row.header { color: var(--muted); background: var(--panel-2); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .token-turns { margin-top: 10px; }

    .overview { padding: 12px 18px 14px; border-bottom: 1px solid var(--line); }

    .section-title { font-weight: 700; }
    .section-note { color: var(--muted); font-size: 11px; }
    .timeline-wrap { position: relative; }

      height: 92px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background:
        linear-gradient(to bottom, transparent 31%, var(--line) 31%, var(--line) 32%, transparent 32%, transparent 65%, var(--line) 65%, var(--line) 66%, transparent 66%),
        repeating-linear-gradient(to right, transparent 0, transparent calc(10% - 1px), color-mix(in srgb, var(--line) 65%, transparent) calc(10% - 1px), color-mix(in srgb, var(--line) 65%, transparent) 10%);

    }
    .turn-boundary { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-strong); opacity: .7; }
    .span { position: absolute; padding: 0; min-height: 0; height: 16px; min-width: 3px; border-radius: 4px; opacity: .88; border: 1px solid color-mix(in srgb, currentColor 70%, #0000); cursor: pointer; }
    .span:hover, .span.selected { opacity: 1; outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); z-index: 4; }
    .span[data-kind="user"] { background: var(--user); color: var(--user); }
    .span[data-kind="assistant"] { background: var(--assistant); color: var(--assistant); }
    .span[data-kind="reasoning"] { background: var(--reasoning); color: var(--reasoning); }
    .span[data-kind="tool"] { background: var(--tool); color: var(--tool); }
    .span[data-kind="subagent"] { background: var(--subagent); color: var(--subagent); }
    .span[data-kind="compaction"] { background: var(--compaction); color: var(--compaction); }
    .span.error { box-shadow: inset 0 0 0 2px var(--danger); }
    #selection {
      position: absolute;
      top: 0;
      bottom: 0;
      display: none;
      background: color-mix(in srgb, var(--accent) 16%, transparent);

    .ticks { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 10px; }
    .toolbar { display: flex; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); align-items: center; }
    #search { flex: 1; min-width: 120px; padding: 7px 10px; }
    #kindFilter { padding: 7px 9px; }
    .range-chip { padding: 5px 8px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; white-space: nowrap; }
    .content { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 360px; border-top: 1px solid var(--line); }
    .ledger-wrap { min-width: 0; max-height: 560px; padding-inline: 18px; overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable; }
    table { width: 100%; min-width: 0; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    col:nth-child(1) { width: 7%; }

    th { color: var(--muted); text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 7px 8px; }
    th:nth-child(1) { width: 7%; }

    td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.record { cursor: pointer; }
    tr.record:hover td { background: var(--panel-2); }
    tr.record.selected td { background: var(--accent-soft); }
    .turn-group { position: relative; }
    .turn-row { cursor: pointer; }
    .turn-row td { padding: 0; border-top: 2px solid var(--line-strong); border-bottom: 1px solid var(--line); color: var(--muted); background: color-mix(in srgb, var(--panel-2) 68%, transparent); }
    .turn-row:hover td { color: var(--text); background: var(--panel-2); }
    .turn-toggle { display: flex; width: 100%; min-height: 44px; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 0; color: inherit; background: transparent; text-align: left; }
    .turn-toggle:hover { color: var(--text); }
    .turn-toggle:focus-visible { position: relative; z-index: 1; outline: 2px solid var(--accent); outline-offset: -2px; }
    .turn-caret { width: 11px; flex: none; color: var(--accent); text-align: center; }
    .turn-copy { flex: 1; min-width: 0; }
    .turn-title { display: block; color: var(--text); font-size: 12px; font-weight: 750; }
    .turn-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
    .turn-cost { margin-left: 5px; color: var(--muted); font-size: 10px; font-weight: 700; }

    }

    .turn-token-value { display: block; margin-top: 2px; color: var(--text); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .turn-column-row { position: sticky; top: 0; z-index: 5; }
    .turn-column-row th { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); box-shadow: 0 1px var(--line); text-overflow: ellipsis; white-space: nowrap; }
    .index, .duration, .mono { overflow-wrap: anywhere; font-size: 12px; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .duration { text-align: right; color: var(--muted); }
    .event { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .event-name, .summary { overflow-wrap: anywhere; white-space: pre-wrap; }

    .command-explanation { padding: 10px 12px; margin-bottom: 12px; border-left: 3px solid var(--tool); border-radius: 8px; background: var(--panel-2); }
    .command-explanation h3 { margin: 0 0 7px; font-size: 12px; }

        ["code", /\b(?:read(?:ing)?|inspect(?:ing)?|locat(?:e|ing)|find(?:ing)?|search(?:ing)?|examin(?:e|ing))\b.{0,65}\b(?:code|implementation|functions?|call\s+(?:chain|sites?)|repository|repo)\b|(?:查找|查看|检查|阅读|梳理).{0,20}(?:代码|实现|函数|调用)/i],
        ["change", /\b(?:implement(?:ing)?|edit(?:ing)?|modif(?:y|ying)|patch(?:ing)?|fix(?:ing)?|design(?:ing)?|refactor(?:ing)?)\b|(?:设计|调整|修改|修复|实现|重构).{0,20}(?:方案|代码|功能|实现|问题|逻辑|界面)/i],
        ["verify", /\b(?:run(?:ning)?|plan(?:ning)?|prepar(?:e|ing)|check(?:ing)?|perform(?:ing)?|validat(?:e|ing)|verify(?:ing)?)\b.{0,65}\b(?:tests?|checks?|validation|verification|behavior|changes?)\b|\b(?:testing|validating|verifying)\b|(?:运行|选择|准备|检查|验证).{0,20}(?:测试|检查|结果|修改|行为)/i],
        ["answer", /\b(?:summari[sz](?:e|ing)|prepar(?:e|ing)|writ(?:e|ing)|draft(?:ing)?|organiz(?:e|ing))\b.{0,65}\b(?:answer|response|reply|conclusions?|findings|summary)\b|(?:整理|准备|组织|撰写).{0,20}(?:结论|答复|回答|总结)/i],
        ["plan", /\b(?:plan(?:ning)?|decid(?:e|ing)|consider(?:ing)?|weigh(?:ing)?|choos(?:e|ing))\b|(?:拆解任务|安排|规划|决定|选择|比较).{0,20}(?:工作|步骤|任务|方案|方式)/i],
      ];

      function reasoningFocus(record) {
        const summary = String(record.summary || "").trim();
        return (summary.match(/^\s*\*\*([^*]+)\*\*/)?.[1]
          || summary.split(/(?:[.!?。！？](?:\s|$)|\n)/, 1)[0]).slice(0, 160);
      }

      function reasoningActivity(record) {
        const summary = String(record.summary || "").trim();
        if (!summary || summary === record.event || /^(?:reasoning(?: summary)?|encrypted reasoning \(summary unavailable\))$/i.test(summary)) {
          return { kind: "missing", text: labels.reasoningMissing };
        }
        const focus = reasoningFocus(record);
        // Do not turn a negated proposal into a claim that an activity is intended.
        if (!/\b(?:not|never|avoid|don't|do not|no need)\b|(?:不要|无需|不必|不会)/i.test(focus)) {
          const cue = reasoningActivityCues.find(([, pattern]) => pattern.test(focus));
          if (cue) return { kind: cue[0], text: labels.reasoningActivities[cue[0]] };
        }
        return { kind: "unknown", text: labels.reasoningUnknown };
      }

      function reasoningActivityText(record, activity = reasoningActivity(record)) {
        if (activity.kind === "unknown" || activity.kind === "missing") return activity.text;
        const subjects = [];
        const pattern = /`([^`\n]{1,80})`|\b((?:[\w.-]+[\/\\])*[\w.-]+\.(?:md|py|tsx?|jsx?|html|css|json|toml|ya?ml|rs|go|sh|sql|txt))\b/gi;
        for (const match of reasoningFocus(record).matchAll(pattern)) {
          const subject = match[1] || match[2];
          if (!subjects.includes(subject)) subjects.push(subject.length > 50 ? subject.slice(0, 49) + "…" : subject);
          if (subjects.length === 3) break;
        }
        if (!subjects.length) return activity.text;
        const separator = zh ? "：" : ":";
        const boundary = activity.text.indexOf(separator);
        return activity.text.slice(0, boundary) + (zh ? "（" : " (") + subjects.join(zh ? "、" : ", ")
          + (zh ? "）" : ")") + activity.text.slice(boundary);
      }

      function recordEventLabel(record) {
        if (record.kind === "reasoning") return labels.reasoningEvent;
        return isCommandRecord(record) ? labels.commandEvent : record.event || "—";
      }

      function reasoningRecordedText(record, full = false) {
        // Longer output is an opted-in saved summary, never private reasoning.
        // Live callers always keep full=false and provide their own safe records.
        const detailed = full && fullDetailsEnabled ? recordDetails.get(record.index)?.record || record : record;
        const text = String(full && fullDetailsEnabled ? detailed.output || record.summary || "" : record.summary || "").trim();
        return !text || text === record.event || /^(?:reasoning(?: summary)?|encrypted reasoning \(summary unavailable\))$/i.test(text) ? "" : text;
      }

      function reasoningActivityLabel(record) {
        const activity = reasoningActivity(record);
        if (activity.kind === "unknown" || activity.kind === "missing") return "";
        return activity.text.split(zh ? "：" : ":", 1)[0];
      }

      function reasoningPreview(record, records, full = false) {
        const text = reasoningRecordedText(record, full);
        if (text) {
          const compact = text.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\s+/g, " ");
          const limit = full ? 600 : 220;
          return compact.length > limit ? compact.slice(0, limit - 1).trimEnd() + "…" : compact;
        }
        const context = [[labels.reasoningBefore, -1], [labels.reasoningAfter, 1]].flatMap(([label, direction]) => {
          const neighbor = reasoningNeighbor(record, direction, records);
          return neighbor ? [`${label} #${neighbor.index} ${recordEventLabel(neighbor)}: ${recordContent(neighbor, records)}`] : [];
        });
        return context.join("\n") || "—";
      }

      function recordContent(record, records = data?.records || [], full = false) {
        if (record.kind === "reasoning") {
          return [reasoningPreview(record, records, full), reasoningActivityLabel(record)].filter(Boolean).join("\n");
        }
        return isCommandRecord(record) ? commandActivity(record).text : record.summary || labels.noMatch;
      }

      function recordContentMarkup(record, records, full = false) {
        if (record.kind !== "reasoning") return escapeHtml(recordContent(record, records));
        const activity = reasoningActivityLabel(record);
        return `<div class="reasoning-preview">${escapeHtml(reasoningPreview(record, records, full))}</div>`
          + (activity ? `<div class="reasoning-activity">${escapeHtml(activity)}</div>` : "");
      }

      function recordEventTooltip(record) {
        if (isCommandRecord(record)) return `Command · ${labels.commandEvent}\n${labels.commandMeaning}\n${recordStatusLabel(record)}`;
        return record.kind === "reasoning"
          ? `${record.event || "Reasoning"} · ${labels.reasoningEvent}\n${labels.reasoningMeaning}`
          : record.event || "—";
      }

      function recordContentTooltip(record, records = data?.records || [], full = false) {
        if (isCommandRecord(record)) {
          const activity = commandActivity(record);
          const exit = activity.exitCode === null ? "" : `\n${labels.commandExitCode}: ${activity.exitCode}`;
          return `${activity.text}\n${recordStatusLabel(record)}${exit}\n\n${labels.summary}: ${record.summary}`;
        }
        if (record.kind !== "reasoning") return record.summary || "";
        const activity = reasoningActivity(record);
        const text = reasoningRecordedText(record, full);
        if (!text) {
          const context = recordContent(record, records);
          return `${labels.reasoningMissing}\n\n${context === "—" ? labels.reasoningNoContext : context}\n\n${labels.reasoningContextNote}`;
        }
        return `${labels.reasoningSource}: ${text.length > 1200 ? text.slice(0, 1199) + "…" : text}\n\n${reasoningActivityText(record, activity)}`;
      }

      const reasoningContextCache = new WeakMap();

      function reasoningNeighbor(record, direction, records = data?.records || []) {
        // Build once per immutable record page, rather than scan for every empty
        // analysis in a large ledger. Missing indexes and turn changes break links.
        let contexts = reasoningContextCache.get(records);
        if (!contexts) {
          contexts = new Map();
          for (const record of records) contexts.set(record.index, {});
          for (const step of [-1, 1]) {
            let previous = null;
            let neighbor = null;
            for (let i = step === 1 ? 0 : records.length - 1; i >= 0 && i < records.length; i += step) {
              const candidate = records[i];
              if (!previous || candidate.turn !== previous.turn || candidate.index !== previous.index + step) neighbor = null;
              contexts.get(candidate.index)[step === 1 ? "before" : "after"] = neighbor;
              if (candidate.kind !== "reasoning") neighbor = candidate;
              previous = candidate;
            }
          }
          reasoningContextCache.set(records, contexts);
        }
        return contexts.get(record.index)?.[direction === -1 ? "before" : "after"] || null;
      }

      function reasoningInspector(record) {
        const activity = reasoningActivity(record);
        const neighbors = [[labels.reasoningBefore, reasoningNeighbor(record, -1)], [labels.reasoningAfter, reasoningNeighbor(record, 1)]];
        const context = neighbors.filter(([, neighbor]) => neighbor).map(([label, neighbor]) =>
          `<button type="button" data-reasoning-context-index="${neighbor.index}"><span>${escapeHtml(label)}</span>#${neighbor.index} ${escapeHtml(recordEventLabel(neighbor))} · ${escapeHtml(recordContent(neighbor))}</button>`
        ).join("");
        const text = reasoningRecordedText(record, true);
        const sourceLabel = text !== record.summary ? labels.reasoningFullSource : labels.reasoningSource;
        const source = !text ? "" : `<section class="reasoning-source"><h3>${escapeHtml(sourceLabel)}</h3><div class="reasoning-source-text">${escapeHtml(text)}</div>
          ${text.endsWith("…") && !record.output ? `<p class="reasoning-note">${escapeHtml(labels.reasoningExcerpt)}</p>` : ""}</section>`;
        return `${source}<section class="reasoning-explanation" data-activity="${activity.kind}"><h3>${escapeHtml(labels.reasoningWhat)}</h3><p>${escapeHtml(reasoningActivityText(record, activity))}</p></section>
          ${activity.kind !== "missing" && activity.kind !== "unknown" ? `<p class="reasoning-note">${escapeHtml(labels.reasoningBasis)}</p>` : ""}
          ${!text && !context ? `<p class="reasoning-note">${escapeHtml(labels.reasoningNoContext)}</p>` : ""}
          ${context ? `<section class="reasoning-context"><h3>${escapeHtml(labels.reasoningContext)}</h3><p class="reasoning-note">${escapeHtml(labels.reasoningContextNote)}</p>${context}</section>` : ""}`;
      }

      function isCommandRecord(record) {
        return record.kind === "tool" && record.event === "Command";
      }

      function commandActivity(record) {
        const match = String(record.summary || "").match(/^Command: ([A-Za-z +]+) · (?:complete|running|error)(?: · exit (-?\d+))?$/);
        const activities = match ? match[1].split(" + ") : [];
        const recognized = activities.length > 0 && activities.every(name => Object.hasOwn(labels.commandActivities, name));
        const exit = match?.[2] === undefined ? null : Number(match[2]);
        return {
          text: recognized ? activities.map(name => labels.commandActivities[name]).join(zh ? "；" : " ") : labels.commandUnknown,
          exitCode: Number.isInteger(exit) && exit >= -(2 ** 31) && exit < 2 ** 31 ? exit : null,
          recognized,
        };
      }

      function recordStatusLabel(record) {
        if (!isCommandRecord(record)) return record.status || "—";
        return ({ complete: labels.commandEnded, running: labels.commandRunning, error: labels.commandFailed, aborted: labels.commandAborted })[record.status] || record.status || "—";
      }

      function commandInspector(record) {
        const activity = commandActivity(record);
        return `<section class="command-explanation" data-recognized="${activity.recognized}"><h3>${escapeHtml(labels.commandWhat)}</h3><p>${escapeHtml(activity.text)}</p></section>
          ${activity.recognized ? `<p class="command-note">${escapeHtml(labels.commandBasis)}</p>` : ""}
          ${record.status === "complete" ? `<p class="command-note">${escapeHtml(labels.commandResultNote)}</p>` : ""}`;
      }
      const number = (value) => Number.isFinite(value) ? new Intl.NumberFormat().format(value) : "—";
      const date = (value) => {
        if (!value) return "—";
        const parsed = new Date(value);
        if (!Number.isFinite(parsed.getTime())) return "—";
        return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "medium" }).format(parsed);
      };
      const duration = (ms) => {
        if (!Number.isFinite(ms) || ms < 1) return "-";
        if (ms < 1000) return `${Math.round(ms)} ms`;
        if (ms < 59500) return `${(ms / 1000).toFixed(ms < 10000 ? 2 : 1)} s`;
        const totalSeconds = Math.round(ms / 1000);
        const seconds = totalSeconds % 60;
        const totalMinutes = Math.floor(totalSeconds / 60);
        if (totalMinutes < 60) return `${totalMinutes}m ${seconds}s`;
        return `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m ${seconds}s`;
      };
      const recordRange = (record) => {
        const start = Date.parse(record.startedAt || "");
        if (!Number.isFinite(start)) return null;
        const endValue = Date.parse(record.completedAt || "");
        const end = Number.isFinite(endValue) ? Math.max(start, endValue) : start + Math.max(0, record.durationMs || 0);
        return { start, end };
      };

      function isPlainObject(value) {
        return value !== null && typeof value === "object" && !Array.isArray(value);
      }

      function callTool(name, args) {
        if (["get_codex_trajectory", "show_codex_trajectory", "get_codex_trajectory_update"].includes(name) && taskReadLimits.has(args?.sessionId)) {
          args = { ...args, maxReadBytes: taskReadLimits.get(args.sessionId) };
        }
        return host.callTool(name, args);
      }

      function resultRevision(result) {
        const value = result?._meta?.["codex-trajectory/revision"];
        return typeof value === "string" && /^[a-f0-9]{64}$/.test(value) ? value : null;
      }

      function changedDetailsMessage() {
        return zh ? "任务日志已变化，请刷新后重新加载详情。" : "Task log changed. Refresh before loading details.";
      }

      function loadViewerPreferences(refresh = false) {
        if (!preferencesPromise || refresh) {
          const revision = ++preferencesRevision;
          preferencesPromise = callTool("get_codex_trajectory_preferences", {}).then(result => {
            if (revision === preferencesRevision) defaultFullDetails = !result?.isError && result?.structuredContent?.defaultFullDetails === true;
          }).catch(() => { if (revision === preferencesRevision) defaultFullDetails = false; });
        }
        return preferencesPromise;
      }

      async function saveViewerDefault(enabled) {
        preferenceSaveFailed = false;
        try {
          const result = await callTool("set_codex_trajectory_preferences", { defaultFullDetails: enabled });
          if (result?.isError || result?.structuredContent?.defaultFullDetails !== enabled) throw new Error();
          defaultFullDetails = enabled;
          return true;
        } catch {
          preferenceSaveFailed = true;
          return false;
        }
      }

      async function receiveHostResult(result) {
        const revision = ++hostResultRevision;
        if (result?.structuredContent?.viewerState === "read-limit-exceeded") render(result.structuredContent);
        else if (result?.isError) {
          showLoadError(new Error((result.content || []).map(item => item?.text).filter(Boolean).join(" ") || labels.loadError));
          return;
        } else if (result?.structuredContent) render(result.structuredContent, { revision: resultRevision(result) });
        await loadViewerPreferences();
        if (revision !== hostResultRevision || busy || isLiveMode()) return;
        if (defaultFullDetails && data?.detailLevel === "summary" && data.session.id === result?.structuredContent?.session?.id) {
          fullDetailsEnabled = true;
          drawShell();
        }
      }

      function applyHostContext(context) {
        const root = document.documentElement;
        const scheme = context.theme;
        if (scheme === "light" || scheme === "dark") {
          root.dataset.codexTheme = scheme;
          root.style.colorScheme = scheme;
        }
        const colorProperties = {
          "--color-background-primary": ["--bg", "--panel"],
          "--color-background-secondary": ["--panel-2"],
          "--color-text-primary": ["--text"],
          "--color-text-secondary": ["--muted"],
          "--color-border-primary": ["--line"],
          "--color-border-secondary": ["--line-strong"],
          "--color-text-danger": ["--danger"],
          "--color-text-success": ["--success"],
        };
        const variables = context.styles?.variables;
        for (const [source, targets] of Object.entries(colorProperties)) {
          const value = variables?.[source];
          for (const target of targets) {
            if (typeof value === "string" && value.length <= 128 && CSS.supports("color", value)) root.style.setProperty(target, value);
            else root.style.removeProperty(target);
          }
        }
        if (!requestedLanguage && typeof context.locale === "string") {
          zh = context.locale.toLowerCase().startsWith("zh");
          labels = translations[zh ? "zh" : "en"];
          root.lang = zh ? "zh-CN" : "en";
        }
        const nextMode = context.displayMode;
        if (nextMode === "inline" || nextMode === "fullscreen") {
          displayMode = nextMode;
          if (isDockMode() && nextMode === "inline" && livePresentation === "docked") {
            finishLiveWindow(true);
            return;
          }
        }
        if (data) {
          if (isDockMode()) drawDockedShell();
          else drawShell();
          if (isNativePipMode()) drawPipCanvas();
        } else {
          const selector = app.querySelector('[data-viewer-state="select-session"]');
          if (selector) {
            selector.querySelector(".eyebrow").textContent = labels.eyebrow;
            selector.querySelector(".notice").textContent = selector.dataset.reason === "task-unavailable" ? labels.unavailableTask : labels.missingContext;
            selector.querySelector("#retryOpen").textContent = labels.retry;
            selector.querySelector("#sessionSelect").setAttribute("aria-label", labels.selectTask);
            populateSessions();
          }
        }
        if (readLimitPrompt) showReadLimit(readLimitPrompt);
      }

      function showSessionSelection(reason = "missing-context", load = true) {
        resetRecordDetails();
        fullDetailsEnabled = false;
        readLimitPrompt = null;
        stopLiveLoop();
        livePresentation = "none";
        liveData = null;
        liveSessionId = null;
        liveRevision = null;
        data = null;
        dataRevision = null;
        document.body.classList.remove("dock-mode");
        app.innerHTML = `<section class="shell" data-viewer-state="select-session" data-reason="${escapeHtml(reason)}">
          <header class="topbar"><div><div class="eyebrow">${labels.eyebrow}</div><h1>Codex Trajectory</h1></div></header>
          <div class="notice" role="status">${reason === "task-unavailable" ? labels.unavailableTask : labels.missingContext}</div>
          <div class="top-actions"><select id="sessionSelect" aria-label="${labels.selectTask}"></select><button type="button" id="retryOpen">${labels.retry}</button></div>
        </section>`;
        populateSessions();
        document.getElementById("sessionSelect").addEventListener("change", event => {
          if (event.target.value) void loadSession(event.target.value);
        });
        document.getElementById("retryOpen").addEventListener("click", async () => {
          recentSessionsRequested = false;
          try {
            const result = await callTool("open_codex_trajectory", {});
            if (result?.isError || !result?.structuredContent) throw new Error(labels.loadError);
            await receiveHostResult(result);
          } catch (error) { showLoadError(error); }
        });
        if (load) void loadRecentSessions();
      }

      function readByteSize(bytes) {
        return bytes >= 1_000_000_000
          ? `${new Intl.NumberFormat(zh ? "zh-CN" : "en", { maximumFractionDigits: 2 }).format(bytes / 1_000_000_000)} GB`
          : `${new Intl.NumberFormat(zh ? "zh-CN" : "en", { maximumFractionDigits: 2 }).format(bytes / (1024 * 1024))} MiB`;
      }

      function showReadLimit(snapshot) {
        const limit = snapshot?.readLimit;
        const sessionId = snapshot?.sessionId;
        if (!limit || ![limit.requiredBytes, limit.currentBytes, limit.suggestedBytes, limit.maximumBytes].every(value => Number.isSafeInteger(value) && value > 0)) {
          showLoadError(new Error(labels.loadError));
          return;
        }
        if (isLiveMode()) finishLiveWindow(false);
        if (!data) showSessionSelection("task-unavailable", false);
        readLimitPrompt = snapshot;
        document.getElementById("readLimitPrompt")?.remove();
        const container = app.querySelector(".shell") || app;
        if (!data) container.querySelector(".notice")?.remove();
        const canRetry = typeof sessionId === "string" && sessionId.length > 0 && sessionId.length <= 240 && !/[\\/]/.test(sessionId) && limit.requiredBytes <= limit.maximumBytes;
        const previousBytes = taskReadLimits.get(sessionId);
        const selectedBytes = previousBytes >= limit.requiredBytes ? previousBytes : limit.suggestedBytes;
        const defaultBytes = Math.max(limit.requiredBytes, Math.min(selectedBytes, limit.maximumBytes));
        const size = limit.atLeast ? labels.readLimitAtLeast.replace("{size}", readByteSize(limit.requiredBytes)) : readByteSize(limit.requiredBytes);
        const message = labels.readLimitSize.replace("{size}", size).replace("{limit}", readByteSize(limit.currentBytes));
        const html = `<section id="readLimitPrompt" class="notice" data-viewer-state="read-limit-exceeded">
          <strong>${labels.readLimitTitle}</strong><div role="status">${escapeHtml(message)}</div>
          ${canRetry ? `<div class="read-limit-controls">
            <label for="readLimitGb">${labels.readLimitLabel}<input id="readLimitGb" type="number" inputmode="decimal" min="${limit.requiredBytes / 1_000_000_000}" max="${limit.maximumBytes / 1_000_000_000}" step="any" value="${defaultBytes / 1_000_000_000}" aria-describedby="readLimitNote" required></label>
            <button id="enableReadLimit" type="button">${labels.enableReadLimit}</button>
          </div>` : `<p>${escapeHtml(limit.requiredBytes > limit.maximumBytes ? labels.readLimitMaximum.replace("{size}", readByteSize(limit.maximumBytes)) : labels.missingContext)}</p>`}
          <p id="readLimitNote" class="read-limit-note">${labels.readLimitNote}</p>
        </section>`;
        const header = container.querySelector(".topbar");
        if (header) header.insertAdjacentHTML("afterend", html); else container.insertAdjacentHTML("afterbegin", html);
        document.getElementById("readLimitGb")?.addEventListener("keydown", event => {
          if (event.key === "Enter") { event.preventDefault(); document.getElementById("enableReadLimit").click(); }
        });
        document.getElementById("enableReadLimit")?.addEventListener("click", () => {
          if (busy) return;
          const input = document.getElementById("readLimitGb");
          const bytes = Math.round(Number(input.value) * 1_000_000_000);
          if (!input.reportValidity() || !Number.isSafeInteger(bytes) || bytes < limit.requiredBytes || bytes > limit.maximumBytes) return;
          taskReadLimits.set(sessionId, bytes);
          input.disabled = true;
          const button = document.getElementById("enableReadLimit");
          button.disabled = true;
          button.textContent = labels.loading;
          void loadSession(sessionId, null, { exactIdentity: true });
        });
        if (!recentSessionsRequested) void loadRecentSessions();
      }

      function safeLiveSnapshot(snapshot) {
        const records = (snapshot?.records || []).slice(-50).map(record => ({
          ...record,
          usage: null,
          cost: null,
          input: null,
          output: null,
          metadata: {},
        }));
        const visibleTurns = new Set(records.map(record => record.turn));
        const turns = (snapshot?.turns || []).filter(turn => visibleTurns.has(turn.index));
        return {
          ...snapshot,
          detailLevel: "summary",
          records,
          turns,
          stats: {
            ...(snapshot?.stats || {}),
            visibleRecords: records.length,
            omittedRecords: Math.max(0, (snapshot?.stats?.records || records.length) - records.length),
          },
        };
      }

      function nativePipSupported() {
        return (
          typeof HTMLVideoElement !== "undefined"
          && typeof HTMLCanvasElement !== "undefined"
          && typeof HTMLVideoElement.prototype.requestPictureInPicture === "function"
          && typeof HTMLCanvasElement.prototype.captureStream === "function"
          && document.pictureInPictureEnabled !== false
        );
      }

      function hostDockSupported() {
        return host.supportsDisplayMode("fullscreen");
      }

      function isNativePipMode() {
        try {
          return livePresentation === "native-pip"
            || pipActive
            || (pipVideo !== null && document.pictureInPictureElement === pipVideo);
        } catch {
          return livePresentation === "native-pip" || pipActive;
        }
      }

      const isDockMode = () => livePresentation === "docked" || livePresentation === "inline-live";
      const isLiveMode = () => isDockMode() || isNativePipMode();

      async function requestHostDisplayMode(mode) {
        if (!host.supportsDisplayMode(mode)) throw new Error(labels.pipUnavailable);
        const result = await host.requestDisplayMode(mode);
        const resolved = result?.mode || result?.displayMode || mode;
        if (resolved !== mode) throw new Error(`${labels.pipFailed}: ${resolved}`);
        displayMode = resolved;
        return resolved;
      }

      function canvasColor(name, fallback) {
        const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return value || fallback;
      }

      function canvasRoundedRect(context, x, y, width, height, radius) {
        const resolved = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + resolved, y);
        context.lineTo(x + width - resolved, y);
        context.quadraticCurveTo(x + width, y, x + width, y + resolved);
        context.lineTo(x + width, y + height - resolved);
        context.quadraticCurveTo(x + width, y + height, x + width - resolved, y + height);
        context.lineTo(x + resolved, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - resolved);
        context.lineTo(x, y + resolved);
        context.quadraticCurveTo(x, y, x + resolved, y);
        context.closePath();
      }

      function fitCanvasText(context, value, maxWidth) {
        const text = String(value ?? "—");
        if (context.measureText(text).width <= maxWidth) return text;
        const suffix = "…";
        let fitted = "";
        for (const character of Array.from(text)) {
          if (context.measureText(fitted + character + suffix).width > maxWidth) break;
          fitted += character;
        }
        return fitted + suffix;
      }

      function fitCanvasValueFont(context, value, maxWidth, maximumSize = 28) {
        const text = String(value ?? "—");
        const family = "ui-monospace, SFMono-Regular, Menlo, monospace";
        context.font = `750 ${maximumSize}px ${family}`;
        const measured = context.measureText(text).width;
        const size = measured > maxWidth && measured > 0
          ? Math.max(8, maximumSize * maxWidth / measured)
          : maximumSize;
        context.font = `750 ${size.toFixed(2)}px ${family}`;
        return text;
      }

      function wrapCanvasText(context, value, maxWidth, maxLines) {
        const characters = Array.from(String(value ?? "—"));
        const lines = [];
        let line = "";
        for (const character of characters) {
          if (line && context.measureText(line + character).width > maxWidth) {
            lines.push(line.trimEnd());
            line = character.trimStart();
            if (lines.length === maxLines) break;
          } else {
            line += character;
          }
        }
        if (lines.length < maxLines && line) lines.push(line.trimEnd());
        const consumed = lines.join("").length;
        if (characters.length > consumed && lines.length) {
          lines[lines.length - 1] = fitCanvasText(context, lines[lines.length - 1] + "…", maxWidth);
        }
        return lines;
      }

      function fillCanvasPanel(context, x, y, width, height, color, radius = 18) {
        canvasRoundedRect(context, x, y, width, height, radius);
        context.fillStyle = color;
        context.fill();
      }

      function liveStateLabel() {
        if (document.hidden) return labels.paused;
        if (liveError) return labels.retrying;
        return labels.live;
      }

      function liveCursorState(latest, stats) {
        const turnIndex = Number.isFinite(latest.turn) ? latest.turn : stats.turns;
        const turn = "T" + number(turnIndex);
        const step = Number.isFinite(latest.step) ? "S" + latest.step : "S—";
        const record = Number.isFinite(latest.index) ? "#" + latest.index : "#—";
        return { turn, step, record, cursor: `${turn} / ${step} / ${record}` };
      }

      function drawPipCanvas() {
        if (!pipCanvas) return;
        const snapshot = liveData || (data ? safeLiveSnapshot(data) : null);
        const context = pipCanvas.getContext("2d");
        if (!context) return;

        const background = canvasColor("--bg", "#12141a");
        const panel = canvasColor("--panel", "#191c24");
        const panelAlt = canvasColor("--panel-2", "#222631");
        const text = canvasColor("--text", "#edf0f7");
        const muted = canvasColor("--muted", "#a1a9ba");
        const accent = canvasColor("--accent", "#8d99ff");
        const success = canvasColor("--success", "#5ed39e");
        const danger = canvasColor("--danger", "#ff7285");
        context.clearRect(0, 0, PIP_CANVAS_WIDTH, PIP_CANVAS_HEIGHT);
        context.fillStyle = background;
        context.fillRect(0, 0, PIP_CANVAS_WIDTH, PIP_CANVAS_HEIGHT);

        if (!snapshot?.session) {
          context.fillStyle = muted;
          context.font = "600 24px -apple-system, BlinkMacSystemFont, sans-serif";
          context.fillText(labels.pipPreparing, 40, 80);
          return;
        }

        const latest = snapshot.records?.at(-1) || {};
        const stats = snapshot.stats || {};
        const usage = usageView(hasTokenUsage(stats.tokens) ? stats.tokens : {});
        const currentTurn = (snapshot.turns || []).find(turn => turn.index === latest.turn)
          || (snapshot.turns || []).at(-1) || {};
        const totalCost = costText(stats.cost);
        const turnCost = costText(currentTurn.cost);
        const quota = rateLimitView(stats.rateLimits, stats.quotaSampledAt);
        const status = recordStatusLabel(latest);
        const { cursor } = liveCursorState(latest, stats);
        const stateLabel = liveStateLabel();
        const tokenItems = [
          [labels.totalTokens, usage.total],
          [labels.uncachedInput, usage.uncached],
          [labels.cachedInput, usage.cached],
          [labels.outputTokens, usage.output],
          [labels.reasoningTokens, usage.reasoning],
        ];

        context.textBaseline = "alphabetic";
        context.fillStyle = accent;
        context.font = "750 19px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(labels.liveTitle.toUpperCase(), 40, 55);
        if (quota.items.length) {
          context.fillStyle = accent;
          context.font = "750 16px -apple-system, BlinkMacSystemFont, sans-serif";
          context.textAlign = "right";
          context.fillText(fitCanvasText(context, quota.compact, 330), 600, 55);
          context.textAlign = "left";
        }
        context.fillStyle = text;
        context.font = "750 34px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(fitCanvasText(context, snapshot.session.title || snapshot.session.id, 560), 40, 105);

        context.beginPath();
        context.arc(50, 150, 8, 0, Math.PI * 2);
        context.fillStyle = liveError ? danger : success;
        context.fill();
        context.fillStyle = muted;
        context.font = "600 20px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(stateLabel, 72, 157);

        fillCanvasPanel(context, 40, 185, 560, 120, panelAlt);
        context.fillStyle = text;
        context.font = "750 43px ui-monospace, SFMono-Regular, Menlo, monospace";
        context.fillText(fitCanvasText(context, cursor, 510), 64, 247);
        context.fillStyle = muted;
        context.font = "600 18px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(fitCanvasText(context, status + " · " + turnCost + " · " + number(stats.records) + " " + labels.records, 510), 64, 282);

        fillCanvasPanel(context, 40, 330, 560, 180, panel);
        context.fillStyle = accent;
        context.font = "750 16px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(labels.latestEvent.toUpperCase(), 64, 370);
        context.fillStyle = text;
        context.font = "750 25px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(fitCanvasText(context, recordEventLabel(latest), 510), 64, 410);
        context.fillStyle = muted;
        context.font = "500 20px -apple-system, BlinkMacSystemFont, sans-serif";
        wrapCanvasText(context, recordContent(latest, snapshot?.records || []), 510, 3).forEach((line, index) => {
          context.fillText(line, 64, 450 + index * 27);
        });

        function drawTokenCard(item, x, y, width, height, emphasized = false, formatter = number) {
          fillCanvasPanel(context, x, y, width, height, emphasized ? panelAlt : panel);
          context.fillStyle = muted;
          context.font = "700 15px -apple-system, BlinkMacSystemFont, sans-serif";
          context.fillText(fitCanvasText(context, item[0].toUpperCase(), width - 40), x + 20, y + 31);
          context.fillStyle = emphasized ? accent : text;
          const formatted = fitCanvasValueFont(context, formatter(item[1]), width - 40);
          context.fillText(formatted, x + 20, y + 72, width - 40);
        }

        drawTokenCard(tokenItems[0], 40, 540, 270, 98, true);
        drawTokenCard([labels.estimatedCost, stats.cost], 330, 540, 270, 98, true, costText);
        drawTokenCard(tokenItems[1], 40, 660, 270, 98);
        drawTokenCard(tokenItems[2], 330, 660, 270, 98);
        drawTokenCard(tokenItems[3], 40, 780, 270, 98);
        drawTokenCard(tokenItems[4], 330, 780, 270, 98);

        context.fillStyle = muted;
        context.font = "600 16px -apple-system, BlinkMacSystemFont, sans-serif";
        context.fillText(labels.liveSafe, 40, 925);
        const checked = labels.checked + ": " + (liveCheckedAt ? date(liveCheckedAt) : "—");
        context.textAlign = "right";
        context.fillText(fitCanvasText(context, checked, 360), 600, 925);
        context.textAlign = "left";

        pipCanvas.dataset.cursor = cursor;
        pipCanvas.dataset.tokens = tokenItems.map(item => String(item[1])).join(",");
        pipCanvas.dataset.totalCost = totalCost;
        pipCanvas.dataset.turnCost = turnCost;
        pipCanvas.dataset.latest = latest.summary || "";
        pipCanvas.dataset.detailLevel = "summary";
        pipCanvas.dataset.liveState = stateLabel;
        pipCanvas.dataset.quota = quota.signature;
        pipCanvas.dataset.payload = JSON.stringify({
          detailLevel: "summary",
          sessionId: snapshot.session.id,
          cursor,
          latest: {
            event: latest.event || "",
            summary: latest.summary || "",
            status,
          },
          tokens: tokenItems.map(item => item[1]),
          costs: {
            total: totalCost,
            turn: turnCost,
          },
          rateLimits: quota.items.map(item => ({
            window: item.key,
            remainingPercent: item.remaining,
            windowLabel: item.label,
            resetsAt: item.resetsAt,
          })),
        });
      }

      function liveViewState() {
        const snapshot = liveData || (data ? safeLiveSnapshot(data) : null);
        if (!snapshot?.session) return null;
        const latest = snapshot.records?.at(-1) || {};
        const stats = snapshot.stats || {};
        const usage = usageView(hasTokenUsage(stats.tokens) ? stats.tokens : {});
        const cursorState = liveCursorState(latest, stats);
        const currentTurn = (snapshot.turns || []).find(turn => turn.index === latest.turn)
          || (snapshot.turns || []).at(-1) || {};
        const quota = rateLimitView(stats.rateLimits, stats.quotaSampledAt);
        return {
          snapshot,
          latest,
          stats,
          cursor: cursorState.cursor,
          cursorParts: cursorState,
          stateLabel: liveStateLabel(),
          quota,
          totalCost: costText(stats.cost),
          totalCostNote: costNoteText(stats.cost),
          turnCost: costText(currentTurn.cost),
          tokenItems: [
            [labels.totalTokens, usage.total],
            [labels.uncachedInput, usage.uncached],
            [labels.cachedInput, usage.cached],
            [labels.outputTokens, usage.output],
            [labels.reasoningTokens, usage.reasoning],
          ],
        };
      }

      function dockRecordMarkup(record, latest, records) {
        const safeKinds = new Set(["user", "assistant", "reasoning", "tool", "subagent", "compaction"]);
        const kind = safeKinds.has(record.kind) ? record.kind : "other";
        const recordCursor = "T" + number(record.turn) + " / "
          + (Number.isFinite(record.step) ? "S" + record.step : "S—") + " / "
          + (Number.isFinite(record.index) ? "#" + record.index : "#—");
        const state = recordStatusLabel(record) + " · " + duration(record.durationMs);
        const recordId = String(record.id || record.index || "");
        const command = isCommandRecord(record) ? commandActivity(record) : null;
        const content = record.kind === "reasoning"
          ? reasoningRecordedText(record) || recordContentTooltip(record, records)
          : recordContentTooltip(record, records);
        const mining = latest && recordId === liveMiningRecordId;
        const whaleMiner = latest ? `<span class="dock-whale-miner${mining ? " mining" : ""}"
          data-record-id="${escapeHtml(recordId)}" data-mining="${String(mining)}" aria-hidden="true">
          <span class="dock-whale-miner-viewport"><span class="dock-whale-miner-y"><span class="dock-whale-miner-sheet"></span></span></span>
        </span>` : "";
        return `<article class="dock-record${latest ? " latest" : ""}" role="listitem"
          data-index="${escapeHtml(record.index)}" data-kind="${kind}">
          ${whaleMiner}
          <details class="dock-record-expand" data-record-id="${escapeHtml(recordId)}"${expandedLiveRecords.has(recordId) ? " open" : ""}>
          <summary class="dock-record-toggle" aria-label="${escapeHtml(labels.recordDetails + " #" + record.index + " · " + recordEventLabel(record))}">
          <div class="dock-record-head"><span class="dock-record-cursor">${escapeHtml(recordCursor)}</span><span class="dock-record-state" title="${escapeHtml(labels.timingNote)}">${escapeHtml(state)}</span></div>
          <div class="dock-record-event" title="${escapeHtml(recordEventTooltip(record))}">${escapeHtml(recordEventLabel(record))}</div>
          <div class="dock-record-summary" title="${escapeHtml(recordContentTooltip(record, records))}">${escapeHtml(recordContent(record, records))}</div>
          </summary>
          <div class="dock-record-details">
            <div class="inspect-grid">
              <div class="inspect-item" title="${escapeHtml(labels.timingNote)}"><span>${escapeHtml(labels.time)}</span><strong>${escapeHtml(duration(record.durationMs))}</strong></div>
              <div class="inspect-item"><span>${escapeHtml(labels.callId)}</span><strong>${escapeHtml(record.callId || "—")}</strong></div>
              <div class="inspect-item"><span>${escapeHtml(labels.started)}</span><strong>${escapeHtml(date(record.startedAt))}</strong></div>
              <div class="inspect-item"><span>${escapeHtml(labels.completed)}</span><strong>${escapeHtml(date(record.completedAt))}</strong></div>
              ${command && command.exitCode !== null ? `<div class="inspect-item"><span>${escapeHtml(labels.commandExitCode)}</span><strong>${command.exitCode}</strong></div>` : ""}
            </div>
            <div class="dock-record-detail-content">${escapeHtml(content)}</div>
            ${record.error ? `<div class="dock-record-detail-content">${escapeHtml(record.error)}</div>` : ""}
          </div>
          </details>
        </article>`;
      }

      function dockTurnSummaryMarkup(turnIndex, turn) {
        const usage = usageView(hasTokenUsage(turn?.usage) ? turn.usage : {});
        const turnCost = costText(turn?.cost);
        return `<div class="dock-turn-summary" role="group" aria-label="${escapeHtml(labels.turn + " " + turnIndex + " · " + labels.estimatedCost + " " + turnCost)}"
          data-turn="${escapeHtml(turnIndex)}" data-turn-tokens="${escapeHtml(usage.total)}" data-turn-cost="${escapeHtml(turnCost)}">
          <strong class="dock-turn-index">T${escapeHtml(turnIndex)}</strong>
          <span class="dock-turn-tokens">${escapeHtml(labels.totalTokens)} ${escapeHtml(number(usage.total))}</span>
          <span class="dock-turn-cost">${escapeHtml(labels.estimatedCost)} ${escapeHtml(turnCost)}</span>
        </div>`;
      }

      function dockRecordRows(records, turns) {
        const retainedIds = new Set(records.map(record => String(record.id || record.index || "")));
        for (const id of expandedLiveRecords) if (!retainedIds.has(id)) expandedLiveRecords.delete(id);
        const turnMap = new Map((turns || []).map(turn => [turn.index, turn]));
        let previousTurn = null;
        return records.map((record, index) => {
          const turnSummary = record.turn !== previousTurn
            ? dockTurnSummaryMarkup(record.turn, turnMap.get(record.turn))
            : "";
          previousTurn = record.turn;
          return turnSummary + dockRecordMarkup(record, index === records.length - 1, records);
        }).join("");
      }

      function setDockText(selector, value) {
        const element = document.querySelector(selector);
        if (!element) return;
        const next = String(value ?? "");
        if (element.textContent !== next) element.textContent = next;
      }

      function setDockAttribute(element, name, value) {
        if (!element) return;
        const next = String(value ?? "");
        if (element.getAttribute(name) !== next) element.setAttribute(name, next);
      }

      function bindDockStream(stream) {
        if (!stream || stream.dataset.scrollBound === "true") return;
        stream.dataset.scrollBound = "true";
        stream.addEventListener("click", event => {
          if (!event.target.closest(".dock-record-toggle")) return;
          // Reading a record must not be interrupted by follow-latest scrolling.
          dockFollowLatest = false;
          stream.dataset.followLatest = "false";
        });
        stream.addEventListener("toggle", event => {
          const details = event.target;
          if (!details.matches(".dock-record-expand") || !stream.contains(details)) return;
          if (details.open) {
            expandedLiveRecords.add(details.dataset.recordId);
            dockFollowLatest = false;
            stream.dataset.followLatest = "false";
          }
          else expandedLiveRecords.delete(details.dataset.recordId);
        }, true);
        stream.addEventListener("scroll", () => {
          dockScrollTop = stream.scrollTop;
          dockFollowLatest = expandedLiveRecords.size === 0
            && stream.scrollHeight - stream.scrollTop - stream.clientHeight <= 36;
          stream.dataset.followLatest = String(dockFollowLatest);
        }, { passive: true });
      }

      function bindDockWhaleMiner(stream) {
        const miner = stream?.querySelector(".dock-whale-miner.mining");
        if (!miner) return;
        const finish = () => {
          if (liveMiningRecordId === miner.dataset.recordId) liveMiningRecordId = null;
          miner.classList.remove("mining");
          miner.dataset.mining = "false";
        };
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          finish();
          return;
        }
        miner.querySelector(".dock-whale-miner-y")?.addEventListener("animationend", finish, { once: true });
      }

      function mountDockedShell(view) {
        const { snapshot, latest, stats, cursor, cursorParts, stateLabel, quota, tokenItems, totalCost, totalCostNote, turnCost } = view;
        const tokenValues = tokenItems.map(item => String(item[1])).join(",");
        const tokenCards = tokenItems.slice(1).map((item, index) => `

        const records = snapshot.records || [];
        const revision = liveRevision || "";
        document.body.classList.add("dock-mode");
        app.innerHTML = `
          <section class="dock-shell" id="liveDock" role="complementary" aria-label="${escapeHtml(labels.liveTitle)}" data-language="${zh ? "zh" : "en"}"

            data-tokens="${escapeHtml(tokenValues)}" data-total-cost="${escapeHtml(totalCost)}" data-turn-cost="${escapeHtml(turnCost)}" data-quota="${escapeHtml(quota.signature)}" data-latest="${escapeHtml(latest.summary || "")}" data-record-count="${records.length}">
            <div class="dock-fixed" id="dockFixedSummary">
              <header class="dock-head">
                <div class="dock-head-copy"><div class="dock-kicker">${escapeHtml(labels.liveTitle)}</div><div class="dock-title" id="dockSessionTitle" title="${escapeHtml(snapshot.session.title || snapshot.session.id)}">${escapeHtml(snapshot.session.title || snapshot.session.id)}</div></div>
                <div class="dock-head-actions">
                  <div class="dock-quota" id="dockQuota" aria-label="${escapeHtml(quota.aria)}" title="${escapeHtml(quota.title)}" data-quota="${escapeHtml(quota.signature)}"${quota.items.length ? "" : " hidden"}>${dockQuotaMarkup(quota)}</div>
                  <button class="dock-close" id="closeDock" type="button" aria-label="${escapeHtml(labels.returnInline)}" title="${escapeHtml(labels.returnInline)}">×</button>
                </div>
              </header>
              <div class="dock-status">
                <span class="dock-live-state" aria-live="polite"><span class="dock-live-dot${liveError ? " error" : ""}" id="dockLiveDot"></span><span id="dockLiveState">${escapeHtml(stateLabel)}</span></span>
                <span class="dock-cursor" id="dockCursor" aria-label="${escapeHtml(cursor)}"><span class="dock-cursor-part" id="dockCursorTurn">${escapeHtml(cursorParts.turn)}</span><span class="dock-cursor-separator">/</span><span class="dock-cursor-part" id="dockCursorStep">${escapeHtml(cursorParts.step)}</span><span class="dock-cursor-separator">/</span><span class="dock-cursor-part" id="dockCursorRecord">${escapeHtml(cursorParts.record)}</span></span>
                <span class="dock-current-turn-cost" id="dockCurrentTurnCost" title="${escapeHtml(labels.estimatedCost)}">${escapeHtml(turnCost)}</span>
                <span class="dock-mode-label" id="dockModeLabel">${escapeHtml(livePresentation === "inline-live" ? labels.inlineLiveMode : labels.dockMode)}</span>
              </div>
              <section class="dock-overview" aria-label="${escapeHtml(labels.taskTotal)}">
                <div class="dock-overview-head"><span class="dock-section-label">${escapeHtml(labels.taskTotal)}</span><span class="dock-overview-meta" id="dockOverviewMeta">${escapeHtml(number(stats.turns) + " " + labels.turns + " · " + number(stats.records) + " " + labels.records)}</span></div>
                <div class="dock-total"><div><div class="dock-total-label">${escapeHtml(tokenItems[0][0])}</div><div class="dock-total-value" id="dockTotalValue">${escapeHtml(number(tokenItems[0][1]))}</div></div><div class="dock-total-cost" id="dockTotalCostMetric" title="${escapeHtml(totalCostNote)}"><div class="dock-total-label">${escapeHtml(labels.estimatedCost)}</div><div class="dock-total-cost-value" id="dockTotalCost">${escapeHtml(totalCost)}</div></div></div>
                <div class="dock-cost-mode" id="dockCostMode">${escapeHtml(fastCostLabel(snapshot))}</div><div class="dock-token-grid">${tokenCards}</div>
              </section>
            </div>
            <section class="dock-stream" aria-label="${escapeHtml(labels.liveOutput)}">
              <header class="dock-stream-head"><span class="dock-stream-title">${escapeHtml(labels.liveOutput)}</span><span class="dock-stream-meta" id="dockStreamMeta">${escapeHtml(number(records.length) + " " + labels.recentRecords + " · " + labels.latestBelow)}</span></header>
              <div class="dock-records" id="liveRecordStream" role="list" data-follow-latest="${String(dockFollowLatest)}" data-revision="${escapeHtml(revision)}" data-language="${zh ? "zh" : "en"}">${dockRecordRows(records, snapshot.turns)}</div>
            </section>
            <footer class="dock-foot"><span>${escapeHtml(labels.liveSafe)}</span><span id="dockChecked">${escapeHtml(labels.checked + ": " + (liveCheckedAt ? date(liveCheckedAt) : "—"))}</span></footer>

        document.getElementById("closeDock")?.addEventListener("click", exitPip);
        const stream = document.getElementById("liveRecordStream");

      function patchDockedShell(view) {
        const { snapshot, latest, stats, cursor, cursorParts, stateLabel, quota, tokenItems, totalCost, totalCostNote, turnCost } = view;
